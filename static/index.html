<!doctype html>
<!-- simple：样式表里各处按它选的界面（经典模式弃用前在两种之间切），现在写死 -->
<html lang="zh-CN" class="simple">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget：手机输入法弹出时，让页面跟着缩，而不是把顶部顶出屏幕 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <!-- 手机状态栏的颜色：和页面底色一样，状态栏和上看板头顶那一小条连成一片 -->
  <meta name="theme-color" content="#faf9f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17181b" media="(prefers-color-scheme: dark)">
  <title>会话查看器</title>
  <!-- 装到桌面（PWA）：浏览器菜单里「安装」后单独一个窗口、没有地址栏。公网入口前面有网页密码，
       取 manifest 默认不带凭据会被拦，所以写 use-credentials；图标由 make_icons.py 画（小小蓝白拿放大镜，裁成圆形），浏览器标签页上也用它 -->
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="vendor/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="vendor/katex.min.css">
  <link rel="stylesheet" href="style.css?v=2">
  <script src="vendor/vue.global.prod.js"></script>
  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/katex.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/diff.min.js"></script>
</head>
<body>
<div id="app" v-cloak>
  <!-- 多用户实例没有游客：没登录、登录失效、退出以后整页只有这一个登录 / 注册界面，
       别的什么都看不到；登录、注册成功后整页刷新（users.js 的 submitAuth）。还没确认是谁时（wait）整页空着 -->
  <div v-if="authGate === 'login'" class="login-page">
    <form class="picker small login-card" @submit.prevent="submitAuth">
      <strong>{{ auth.mode === 'login' ? '登录' : '注册' }}</strong>
      <small v-if="me.stale && auth.mode === 'login'" class="error">{{ me.stale.replace(/，现在是游客$/, '') }}，请重新登录</small>
      <input v-model="auth.name" autofocus autocomplete="username" placeholder="用户名">
      <input v-model="auth.password" type="password" :autocomplete="auth.mode === 'login' ? 'current-password' : 'new-password'"
             :placeholder="auth.mode === 'login' ? '密码' : '密码（至少 4 位）'">
      <input v-if="auth.mode === 'register'" v-model="auth.again" type="password" autocomplete="new-password" placeholder="确认密码">
      <p v-if="auth.error" class="error">{{ auth.error }}</p>
      <div class="picker-foot">
        <button type="button" class="linkish" @click="Object.assign(auth, { mode: auth.mode === 'login' ? 'register' : 'login', error: '' })">
          {{ auth.mode === 'login' ? '没有账号？注册' : '已有账号？登录' }}</button>
        <button :disabled="auth.busy || !auth.name.trim() || !auth.password">{{ auth.busy ? '正在' + (auth.mode === 'login' ? '登录…' : '注册…')
          : auth.mode === 'login' ? '登录' : '注册' }}</button>
      </div>
    </form>
  </div>
  <template v-else-if="authGate === 'app'">
  <!-- 标签页栏：手机电脑都排在页面最底下（样式里 order: 2，模板里留在最前面）。
       标签页多了自己横着滚，加号像浏览器那样跟在最后一个标签页右边，挤满了就停在最右。
       默认没有标签页栏：在左上角的侧边栏里换会话、开新会话（app.js 换会话时把旧的收掉）；
       设置里开了「底部标签页」（sessions.keepTabs）才有：固定贴在窗口最底下，输入框底下那排小标签加高它的高度、
       小标签和输入框都让到它上面，不互相盖住（style.css 的 .simple .tabbar、--tabbar-h）。
       本机偏好里再开了「垂直标签页」（sessions.sideTabs）就不在底下，改成竖着列在侧边栏「最近」上面（.side-tabs） -->
  <!-- clear：正看着还没说话的新会话页，手机上栏底透明、露出底下的主题色云（和 .fresh-clouds 的 gone 同一个条件） -->
  <!-- me-gap：宽屏收起侧边栏时左下角有头像（.rail-me），栏左边让开它 -->
  <!-- see-through：看着普通会话时栏底透明，和小标签那一排的渐隐连成一片（style.css 最后 .tabbar.see-through）；新会话页上那一排没有渐隐，照旧 -->
  <div v-if="keepTabs && !sideTabs" class="tabbar" :class="{ clear: current?.fresh && !current.busy && !current.pending.length,
                                                'me-gap': sideWide && !sideOpen && me.name, 'see-through': !current?.fresh }">
    <nav class="tabs">
      <!-- 标签页上只写标题；花费、最近一句话放在悬停卡片里（tabTip），不用浏览器自带的提示（路径 用户反馈不写了） -->
      <!-- 开着待办页时没有哪个标签是当前的（待办页不占标签，和会话平级）；点哪个都是收起待办页、切到它，点底下那个也一样 -->
      <button v-for="t in tabs" :key="t.id" class="tab" :class="{ on: t.id === (pagerOn || active) && !td.open, fresh: t.fresh }" @click="closeTodos(); select(t)"
              v-longpress="e => tabMenu(e, t)" @mouseenter="showTabTip($event, t)" @mouseleave="tabTip.tab = null">
        <!-- 点和侧边栏「最近」同一套（sessions.js 的 sideDot：干活闪绿、停在额度上橙、出错红、未读绿，闲着不画）。
             点不放在文字那一行里，单独占一格（dot-slot），按药丸的实际高度和左端半圆同心（style.css 的 .dot-slot） -->
        <span class="dot-slot"><span class="dot side-dot" :class="sideDot(t)"></span></span>
        <span class="name">{{ t.title || fileName(t.path) }}</span>
        <span v-if="t.unread" class="badge">{{ t.unread }}</span>
        <!-- 叉和药丸右端的半圆同心（style.css 的 .tab .x） -->
        <span class="x" aria-label="关闭" @click.stop="close(t)"><svg viewBox="0 0 8 8"><path d="M1 1l6 6M7 1 1 7"/></svg></span>
      </button>
    </nav>
    <!-- 左键在家目录开新会话，右键先选文件夹（以前悬停有一句说明，用户反馈不弹） -->
    <button class="tab-new" aria-label="新会话" @click="closeTodos(); openFresh()" @contextmenu.prevent="openPicker()">
      <span class="plus">+</span>
    </button>
  </div>
  <!-- 从标签页那里弹出、收起时缩回（tip-pop，样式在 style.css「悬停卡片」那段） -->
  <transition name="tip-pop">
  <!-- side：侧边栏里的垂直标签页弹在它右边；侧边栏收起来了（Esc、点缝）就不留着 -->
  <div v-if="tabTip.tab && tabs.includes(tabTip.tab) && (!tabTip.side || sideOpen && sideTabs)" class="now-tip tab-tip"
       :class="{ 'at-side': tabTip.side }"
       :style="{ left: tabTip.x + 'px', top: tabTip.y + 'px', '--tip-origin': tabTip.ox + 'px' }">
    <div v-if="spentText(tabTip.tab.spent)"><b>花费</b><spent-pts :spent="tabTip.tab.spent" :paid="tabTip.tab.spentPaid"
      :blue="tabTip.tab.spentBlue"></spent-pts></div>
    <div v-if="lastSaid(tabTip.tab)" class="tt-said"><b>最近</b>{{ lastSaid(tabTip.tab) }}</div>
  </div>
  </transition>

  <!-- 看板：手机电脑一样拆成上看板（bar-head：会话名、标签、路径、时间）和下看板（bar-tools：小标签和几个图标按钮），
       外壳 .bar 不占位（display: contents），两半分别贴在对话区上下 -->
  <header class="bar">
    <div class="bar-head">
    <!-- 上看板没有实体，只剩几个按钮浮在对话上面：左上角上长下短两条横线，打开侧边栏
         （新会话、搜索、最近的会话、账号和设置都在里面）；右上角新建会话（纸上一支笔）和竖着的「⋯」。
         会话名和花费不写在这里，在侧边栏里当前会话那一项上看 -->
    <!-- 左上角打开侧边栏（照 Gemini，没有圆底、悬停才打底）：宽屏是方框图标（Lucide 的 panel-left，ISC 许可），
         侧边栏开着时它在侧边栏顶上那一行（收起），这里不画；窄屏是两条横线，拉出抽屉 -->
    <!-- 小红点（devices.js 的 devDot）：一台自己的设备都没有时从「＋ 添加设备」一路往外点到这里：侧边栏收着时看得到 -->
    <button v-if="!(sideWide && sideOpen)" class="icon-btn side-btn" aria-label="侧边栏" @click.stop="openSide()">
      <svg v-if="sideWide" class="ico24" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
      <svg v-else viewBox="0 0 16 16"><path d="M2.5 5.5h11M2.5 10.5h6.5"/></svg>
      <i v-if="devDot" class="rdot corner"></i>
    </button>
    <!-- 新建会话：和侧边栏里的「新会话」一样（纸上一支笔，Lucide 图标库的 square-pen，ISC 许可，24 格画布）。
         新会话的入口任何时候只有一处：宽屏侧边栏开着时只有侧边栏顶上那颗药丸，这里不画；
         宽屏收着时留在药丸里那支笔原来的位置（rail）；窄屏在右上角，已经在新会话页上时不画（右上角只剩头像） -->
    <!-- 待办页（td.open）盖在新会话页上时照样要这颗：待办页不是新会话页 -->
    <button v-if="!readonly && !(sideWide && sideOpen) && !(!sideWide && current?.fresh && !td.open)" class="icon-btn new-btn" :class="{ rail: sideWide }" aria-label="新会话"
            @click.stop="closeTodos(); openFresh()">
      <svg viewBox="0 0 24 24"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>
    </button>
    <!-- 宽屏收起侧边栏：笔底下再放一颗搜索，和侧边栏顶上那颗搜索一样，搜全部会话 -->
    <button v-if="sideWide && !sideOpen" class="icon-btn rail-search" aria-label="搜索会话" @click.stop="openSearch('all')">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4"/><path d="M10 10l3.5 3.5"/></svg>
    </button>
    <!-- 宽屏收起侧边栏：头像留在侧边栏底下那个头像原来的位置（左下角），点了打开侧边栏的账号页；
         开着底部标签页时标签页栏左边让开它（.tabbar.me-gap） -->
    <button v-if="sideWide && !sideOpen && me.name" class="icon-btn rail-me" :aria-label="`账号：${me.name}`" @click.stop="openMe()">
      <i class="side-avatar"><img v-if="avatarSrc" :src="avatarSrc" alt=""><template v-else>{{ me.name.slice(0, 1) }}</template></i>
    </button>
    <!-- 审稿看板（review-board.js）：只有自动审稿的会话（跑过 review.py、或选了审稿人设卡）才有这颗，挨在「⋯」左边；别的会话不画 -->
    <button v-if="current && !td.open && reviewable(current)" class="icon-btn review-btn" aria-label="审稿看板" @click.stop="openReview()">
      <svg class="ico24" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 12.5l2 2 4-4.5"/></svg>
    </button>
    <!-- 会话的操作（重命名、标签、导出、删除，和右键标签页一样）放在右上角竖着的「⋯」里 -->
    <!-- 待办页上没有：它不是会话，菜单里没有能用的项 -->
    <button v-if="current && !current.fresh && !td.open" class="icon-btn more-btn" aria-label="会话操作"            @click.stop="tabMenu($event, current)">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="3.5" r="0.9"/><circle cx="8" cy="8" r="0.9"/><circle cx="8" cy="12.5" r="0.9"/></svg>
    </button>
    <!-- 新会话页的右上角是自己的头像（照 Gemini），占「⋯」的位置：还没开始的会话没什么可操作的。
         和侧边栏底下那个头像一个样子（主题色圆里写名字头一个字），点了打开账号页；没登录的没有。
         只给窄屏：宽屏的头像固定在左下角（侧边栏底下或收起时的 .rail-me），右上角再放一颗就重复了 -->
    <button v-if="current?.fresh && !td.open && me.name && !sideWide" class="icon-btn avatar-btn" :aria-label="`账号：${me.name}`" @click.stop="openMe()">
      <i class="side-avatar"><img v-if="avatarSrc" :src="avatarSrc" alt=""><template v-else>{{ me.name.slice(0, 1) }}</template></i>
    </button>
    <!-- 推送断了：顶上按钮底下居中的一颗药丸，带个转圈，字收短到手机上一行放得下（用户反馈横幅样式旧），重新连上就收起 -->
    <div v-if="pushLost" class="push-banner" role="status"><i class="push-spin"></i>连接已中断，正在重新连接…</div>
    </div>
    <!-- 这一排整个搬进正在看的会话输入框底下的槽（.tools-slot），和输入框在同一个滚动区里（app.js 的 toolsTo）；
         toolsTo 空着（槽还没画出来）就先挂在 body 上 -->
    <teleport :to="toolsTo || 'body'" :disabled="!toolsTo">
    <div class="bar-tools">
    <!-- 新会话标签页也有权限、模型、账号三个小标签：选的先记在标签页上，说出第一句话建会话时一起交给服务器 -->
    <!-- 分成三段：警告和账号额度、上下文和权限（连同请求大小提醒、工作设备）、模型和强度。
         样式里整排左右镜像着摆，屏幕上是模型在左、账号在右（style.css 的 .chip-grp）。
         两头那两段一样宽，中间那段才落在整行正中，两头的字变长变短时不跟着晃 -->
    <div v-if="current" class="chips" :key="'chips-' + current.id" :class="{ 'bar-in': slide.dir, back: slide.dir < 0 }">
      <div class="chip-grp grp-l">
      <span v-if="current.missing" class="chip warn">会话文件不存在</span>
      <!-- 服务器配置没取到：不能当成只读，挂着让用户点一下重试 -->
      <button v-if="configError" type="button" class="chip warn" @click="loadRoot()">服务器配置加载失败，点击重试</button>
      <span v-else-if="readonly" class="chip faint">只读</span>
      <!-- 网页对话用的账号：名字、5 小时还剩多少，后面一根直的 5 小时血条（还能用的固定绿色、淡红呼吸的最近 30 分钟用掉的，
           本周不够时右端砍掉一截），不写本周；
           本周剩 0% 只写一句灰字「本周额度用完了」（真用完和被别人订掉都这样写）。悬停列出本组各号和各自的额度，换号后下次发话用新号续接 -->
      <div v-if="!readonly && acctName" class="dd acct-dd" :class="{ on: openDd === 'account' }" @mouseenter="loadQuota()">
        <button class="chip faint mode-chip acct-chip" @click.stop="toggleDd('account'); loadQuota()">
          <template v-if="accountBusy">切换中…</template>
          <template v-else>
            <!-- 手机上剩多少的数字（acct-pct）藏起来，只留名字和名字底下一根细血条。
                 名字写成单色的家族图标加编号（acct-tag.js），图标跟着字的提醒色走；悬停卡片里的是彩色的 -->
            <!-- 提醒色挂在图标、号名和百分比外面那层上，三样一起变色、一起呼吸（以前百分比照旧灰着） -->
            <span><span :class="acctChip.warn"><acct-tag :name="acctName" :family="acctFamily(acctName)"></acct-tag><span
              v-if="!acctChip.weekOut" class="acct-pct"> · {{ acctChip.text }}</span></span><span
              v-if="acctChip.weekOut" class="q-week-out"> · 本周额度已用尽</span></span>
            <span v-if="acctChip.bar" class="q-bar chip-bar" :style="{ clipPath: acctChip.bar.clip || null }"><quota-segs
              :f="acctChip.bar"></quota-segs></span>
          </template>
        </button>
        <div class="dd-panel modes acct-panel">
          <!-- 能选的号排成一张表，一个号一行，每样东西各占一列：账号、5 小时（血条、剩余、in）、本周（剩余、in）、查询、代理。
               in 是多久后重置（in 2h13m / in 2d5h），单独成列才能上下左对齐。表头只有一行、一律靠左，5 小时、本周跨各自那几列；
               不许一个号里又横又竖、底下另起一排；代理放最后。
               各行用 subgrid 共用表格的列，列宽跟着这一列最宽的那格走。权威读数（/usage、状态栏、限额事件）的百分比垫淡底 -->
          <!-- 预定不放按钮（以前表头有一个，点进去还得在下拉里再选号，已删）：电脑右键、手机长按哪个号就预定哪个号。
               表上面原来有一行灰字说明怎么开，用户反馈可以去掉了（新会话页的账号表也一样） -->
          <!-- 卡片限高时（app.js 的 place）只有表头下面那一块（acct-body）上下滚：能选的号在最前面，墓碑收成一行接在后面。
               表头在滚动区外面、固定在顶上，滚动条只画在下面这一块旁边（以前表头吸在滚动区顶上，滚动条顶到表头和圆角）。
               表头和各行还挂在同一张表上，列宽照旧共用；手机上表太宽时外面这层（acct-scroll）连表头一起左右滑。
               底下的红字也在表身里跟着滚；刷新额度浮在卡片底边上不动 -->
          <div class="acct-scroll">
          <div v-if="accountGroups.available.length || accountGroups.unavailable.length" class="acct-table"
               :style="{ '--num-w': acctNumWidth(accountGroups.available) }">
            <div v-if="accountGroups.available.length" class="acct-row acct-head">
              <span>账号</span>
              <span class="acct-span3">5小时</span>
              <span class="acct-span2">本周</span>
              <span>查询</span>
              <span class="acct-head-proxy">代理</span>
            </div>
            <div class="acct-body">
            <!-- 右键（手机上长按）某一行，打开这个号的预定面板（reserve.js）。
                 行写成 role="button" 的 div（以前行里放过按钮），回车、空格照样能选 -->
            <!-- 本周用完、等重置的号只露靠上三个，其余收进表尾那一行「另有 N 个号待重置」（app.js 的 waitFolded），逐行长出来、缩回去（rowIn / rowOut） -->
            <template v-for="folded in [waitFolded(accountGroups.available, current.account || (current.fresh ? fallbackAccount() : ''))]" :key="'wait'">
            <template v-for="a in accountGroups.available" :key="a.name"><transition :css="false" @enter="rowIn" @leave="rowOut">
            <div v-show="waitOpen || !folded.includes(a.name)" class="dd-item acct-row" :class="{ on: a.name === (current.account || (current.fresh ? fallbackAccount() : '')), 'week-out': quotaCells(a.name).weekOut }"
                 role="button" tabindex="0" @click="setAccount(a.name)" @keydown.enter.self.prevent="setAccount(a.name)"
                 @keydown.space.self.prevent="setAccount(a.name)" v-longpress="() => openReserve(a.name)">
              <!-- 免费号的绿色「免」去掉了（现在已经没有免费号，界面上的花费只写实扣的钱）。
                   限时特惠里的号挂「特惠 1折」（instance.PROMO，到点自动消失）；自己是号主的号挂「我的」（me.owns）；
                   按时段计价的 API 号（DeepSeek、智谱）挂此刻是「峰」还是「谷」。「峰」「谷」要排在特惠前面：特惠那个总在（v-show），

                  <small class="acct-dim">{{ !q.tsAt ? '–' : shortAgo(q.tsAt) }}</small>

      <div class="chip-grp grp-c">

           悬停弹出上下文组成的环形图（ctx-ring.js，像 GNOME 磁盘用量分析：里圈粗外圈细，拆到每个文件、每个气泡）；

      <!-- 请求大小提醒（chat.js 的 reqWarn）：最大的一次请求到了上游单条上限的七成才出现，悬停看说明，手机上点一下弹出说明 -->

        <div class="dd-panel ctx-panel">

            <span>{{ m }}</span><small v-if="m === 'auto' && runModeOf({ ...current, webMode: 'auto', runMode: null }) !== 'auto'"              >该账号不支持 auto，按 dontAsk 执行</small><small v-else>{{ MODE_TIPS[m] }}</small>

           Claude 在下一句话收到新清单）；最底下一直有「＋ 添加设备」。新会话标签页也在这里（以前在中间的表单里单占一行）：
           勾选先记在标签页上（devices.js 的 toggleWork），发第一句话时交给服务器。

      <div v-if="workShown(current)" class="dd work-dd" :class="{ on: openDd === 'work' }" @mouseenter="dev.loaded || loadDevices()">

      <div v-if="(current.model || current.fresh || modelOf(current).model) && !readonly" class="dd model-dd" :class="{ on: openDd === 'model' }" @mouseenter="loadInfo(false, false)">

                <i class="dot side-dot" :class="sideDot(t)"></i>
                <span class="side-title">{{ t.fresh ? t.pending?.[0]?.text || '新会话' : t.title || fileName(t.path) }}</span>
                <small class="side-meta">{{ t.fresh ? (t.busy ? '正在创建…' : t.cwd || '~') : '刚刚' }}</small>
              </button>
              <!-- 只亮正在看的那一个（开着的标签页可能不止一个）。
                   右键（手机上长按）、右边的「⋯」：和右上角「⋯」同一份会话菜单（app.js 的 sideMenu）。
                   花费几段用加号连、不写「分」，不写工作区 -->
              <!-- 手机上往右划一行露出主题色的底，划过松手置顶或取消（app.js 的 pinSwipe）；置顶的排在最上面，第二行开头一颗小图钉 -->
              <button v-for="s in recent" :key="s.id" class="dd-item side-sess" :class="{ on: s.id === active && !td.open }"
                      @click="sideDone(); openRecent(s)" v-longpress="e => sideMenu(e, s)"
                      v-pin-swipe="sidePins ? () => togglePin(s) : null" :data-pin="s.pinned ? '取消置顶' : '置顶'" :data-id="s.id">
                <i class="dot side-dot" :class="sideDot(s)"></i>
                <span class="side-title">{{ s.title || fileName(s.path) }}</span>
                <small class="side-meta"><svg v-if="s.pinned" class="side-pin" viewBox="0 0 16 16" aria-label="已置顶"><path
                       d="M6 2.5h4M6.8 2.5 6.3 6.5 4.3 8.5v1h7.4v-1l-2-2-.5-4M8 9.5v4"/></svg><span v-if="s.tags?.length" class="side-tags"><span v-for="t in s.tags" :key="t" class="tag"
                       :style="tagStyle(t)">{{ t }}</span></span><spent-pts bare :spent="s.spent" :paid="s.spentPaid"
                       :blue="s.spentBlue"></spent-pts></small>
                <small class="side-time">{{ shortAgo(s.mtime) }}</small>
                <i class="side-more" role="button" aria-label="会话操作" @click.stop="sideMenu($event, s)"><svg viewBox="0 0 16 16"><circle
                   cx="8" cy="3.5" r="0.9"/><circle cx="8" cy="8" r="0.9"/><circle cx="8" cy="12.5" r="0.9"/></svg></i>
              </button>
              <!-- 侧边栏一页页画、一页页取（sessions.js 的 moreSide）：滚到这一行附近就接下一页，取的时候、出错时写在这里，出错点它重试 -->
              <p v-if="recent.length && (sideHasMore || sideMoreState)" :ref="sideMoreRef" class="side-next"
                 :class="{ error: sideMoreState && sideMoreState !== 'loading' }" @click="retryMore()">
                {{ sideMoreState === 'loading' ? '正在加载更早的会话…' : sideMoreState ? `${sideMoreState}（点击重试）` : '' }}</p>
              <p v-if="!recent.length && !recentTabs.length" class="empty" :class="{ error: !['', 'loading', 'ok'].includes(recentState) }">
                {{ recentState === 'ok' ? '暂无会话'
                   : recentState === 'loading' || !recentState ? '正在加载…' : recentState }}</p>
            </div>
          </div>
    </teleport>
    <!-- 侧边栏设置页的内容（#side-settings），由 teleport 搬过去。
         是谁、余额、设备这些入口不在这里，在侧边栏的账号页里排成列表（sideView === 'me'） -->
          <teleport to="#side-settings" defer>
          <!-- 下面几组：我的设置跟着账号存在服务器上、各设备一样（多用户实例里登录了才有）；全局设置也存在服务器上，只有查看器账号（和单用户实例）有；
               本地偏好只记在这台设备的浏览器里。只读模式没有前两组 -->
          <template v-if="!readonly && me.multi && me.name">
            <div class="dd-group">个人设置<small>多设备同步</small></div>
            <!-- 自动切号：当前的号被预测拦截拦下时，按自动挑号的排法换一个号接着发（server.switch_target），默认开着 -->
            <label v-if="typeof globalSettings.autoSwitch === 'boolean'" class="switch"><input type="checkbox"
              :checked="globalSettings.autoSwitch" :disabled="switchBusy" @change="setAutoSwitch($event.target)"><i></i>自动切换账号</label>
            <!-- 底部标签页：也留着页面底下的标签页栏（sessions.keepTabs），默认开（users.bottom_tabs） -->
            <label v-if="typeof globalSettings.bottomTabs === 'boolean'" class="switch"><input type="checkbox"
              :checked="globalSettings.bottomTabs" :disabled="tabsBusy" @change="setBottomTabs($event.target)"><i></i>底部标签页</label>
            <!-- 讯飞语音输入（voice.js、服务器 voice.py）：识别服务和讯飞开放平台的三样密钥跟着账号存，配了输入框里才有语音按钮。
                 旧后端不给 voice，不出这一项。APISecret 存进去就不再给回来，两个密钥框留空保存是沿用已存的 -->
            <template v-if="globalSettings.voice">
              <div class="set-pick"><span>语音输入</span><button type="button" class="mini" @click="openVoiceForm()">{{
                voiceForm.open ? '收起' : globalSettings.voice.service ? '修改' : '配置' }}</button></div>
              <p class="global-note">{{ globalSettings.voice.service
                ? `讯飞${globalSettings.voice.serviceName} · APPID ${globalSettings.voice.appid} · APIKey 末四位 ${globalSettings.voice.keyTail}`
                : '未配置。填入讯飞开放平台的 APPID、APIKey、APISecret 后，输入框发送按钮左边会出现语音按钮' }}</p>
              <form v-if="voiceForm.open" class="voice-form" @submit.prevent="saveVoice">
                <ui-select v-model="voiceForm.service" aria-label="识别服务"
                           :options="globalSettings.voiceServices.map(s => ({ value: s.id, label: s.name }))"></ui-select>
                <input v-model="voiceForm.appid" autocomplete="off" spellcheck="false" placeholder="APPID">
                <input v-model="voiceForm.apiKey" autocomplete="off" spellcheck="false"
                       :placeholder="globalSettings.voice.service ? 'APIKey（留空则不修改）' : 'APIKey'">
                <input v-model="voiceForm.apiSecret" type="password" autocomplete="new-password"
                       :placeholder="globalSettings.voice.service ? 'APISecret（留空则不修改）' : 'APISecret'">
                <div class="voice-form-btns">
                  <button v-if="globalSettings.voice.service" type="button" :disabled="voiceForm.busy" @click="clearVoice()">清除配置</button>
                  <button type="submit" :disabled="voiceForm.busy">{{ voiceForm.busy ? '正在保存…' : '保存' }}</button>
                </div>
              </form>
            </template>
            <!-- 新会话页上放不放这几项（sessions.feature）：服务器给了才有（旧后端没有，照旧全都有）。不另起「新会话」小标题（没必要），
                 存的时候开关先变灰点不了，没存上由 setFeature 报错、开关弹回去。
                 二次元风格 UI（存的还是 persona 那个键）只管外观：新会话页上的看板娘小小蓝白（加载不了时是颜文字）和人设卡下拉，关着时人设卡照样用最近选的那张。
                 小小蓝白的出处（对方要求写在设置里）紧跟在这个开关下面；看不到这个开关的人写在设置页最后（xxlb.js 的 XxlbCredit）。
                 共用环境只给有自己独立环境、又不是新用户的人（新用户本来就只有独立环境，没有独立环境的关了也没处去） -->
            <template v-if="globalSettings.features">
              <label class="switch"><input type="checkbox" :checked="globalSettings.features.persona" :disabled="!!featureBusy"
                @change="setFeature('persona', $event.target.checked)"><i></i>二次元风格界面</label>
              <xxlb-credit></xxlb-credit>
              <label v-if="environments.enabled && environments.environment && !me.newUser" class="switch"><input type="checkbox"
                :checked="globalSettings.features.shared" :disabled="!!featureBusy"
                @change="setFeature('shared', $event.target.checked)"><i></i>共用环境</label>
              <!-- 标签（默认关）：只管新会话页上那一项。没重启的旧后端不给这个键、也不认，就不出这个开关（新会话页照旧有标签） -->
              <label v-if="'tags' in globalSettings.features" class="switch"><input type="checkbox"
                :checked="globalSettings.features.tags" :disabled="!!featureBusy"
                @change="setFeature('tags', $event.target.checked)"><i></i>标签</label>
            </template>
            <!-- 多用户实例：登录的人设自己的默认账号，没设就是自动（users.user_default，用户反馈默认就是自动，
                 以前没设是跟全局那份，下拉框里有一项「跟大家的默认」）；全局那份现在只管游客。
                 和开关一样是一行选项：字在左、下拉框在右（.set-pick，以前是小标题加一整行的下拉框）。
                 旧后端没设时给 null，这里照样画成自动（两个实例的全局都是自动，结果一样） -->
            <template v-if="me.multi && me.name">
              <div class="set-pick"><span>新会话默认账号</span>
              <ui-select class="global-pick" :model-value="globalSettings.mine || 'auto'" :disabled="globalSettings.busy"
                         aria-label="新会话默认账号" @change="v => saveSetting('defaultAccount', v, 'mine')"
                         :options="[{ value: 'auto', label: '自动（额度最充足）' },
                                    ...defaultChoices.map(a => ({ value: a.name, label: acctLabel(a), disabled: a.banned }))]"></ui-select></div>
              <p class="global-note">{{ globalSettings.busy ? '正在保存…'
                : globalSettings.default.account ? `当前：${globalSettings.default.account}` : '当前无可用账号' }}</p>
            </template>
          </template>
          <!-- 多用户实例里只有查看器账号（instance.json 的 admins）看得到，游客和普通用户都没有这一组 -->
          <template v-if="!readonly && (!me.multi || globalSettings.canGlobal)">
            <div class="dd-group">全局设置<small>{{ me.multi ? '仅查看器账号可见，对所有用户、所有设备生效' : '对所有设备生效' }}</small></div>
            <!-- 和「我的设置」里那项一样排成一行（.set-pick）。多用户实例里登录的人没设自己的就是自动，全局默认只管游客，游客用不了限量号 -->
            <div class="set-pick"><span>{{ me.multi ? '游客的新会话默认账号' : '新会话默认账号' }}</span>
            <ui-select class="global-pick" :model-value="globalSettings.settings.defaultAccount || ''"
                       :disabled="globalSettings.busy || !globalSettings.canGlobal"
                       :aria-label="me.multi ? '游客的新会话默认账号' : '新会话默认账号'" @change="v => saveSetting('defaultAccount', v)"
                       :options="[{ value: '', label: `跟随启动参数（${globalSettings.fallback}）` }, { value: 'auto', label: '自动（额度最充足）' },
                                  ...sortedAccounts.map(a => ({ value: a.name, disabled: a.banned || (me.multi && a.paid),
                                                          label: me.multi && a.paid ? `${a.name}（限量号，游客不可用）` : acctLabel(a) }))]"></ui-select></div>
            <!-- 「现在用哪个号」说的是自己：多用户实例里上面我的设置写过了，这里只有单用户实例写 -->
            <p v-if="!me.multi" class="global-note">{{ globalSettings.busy ? '正在保存…'
              : globalSettings.default.account ? `当前：${globalSettings.default.account}` : '当前无可用账号' }}</p>
          </template>
          <p v-if="!readonly && globalSettings.error" class="error global-note">{{ globalSettings.error }}</p>
          <div class="dd-group">本机偏好<small>仅本设备</small></div>
          <div class="dd-title">显示</div>
          <!-- 全屏：收起手机顶上的时间电量栏（app.js 的 setFull），开着时退出全屏后点一下页面就回去；浏览器不支持就不出 -->
          <label v-if="canFull" class="switch full-switch">
            <input type="checkbox" :checked="full" @change="setFull($event.target.checked)"><i></i>全屏
          </label>
          <!-- 桌面应用全屏打开（设备级）：装到桌面（PWA）以后整个应用窗口全屏，记在这台设备的 cookie 里，
               服务器按它给清单（server.py 的 /manifest.json、sessions.js 的 setPwaFull）；旧后端不给 cookie 名，不出 -->
          <label v-if="pwaCookie" class="switch"><input type="checkbox" :checked="pwaFull" @change="setPwaFull($event.target)"><i></i>桌面应用以全屏打开</label>
          <label v-for="(label, key) in filterLabels" :key="key" class="switch">
            <input type="checkbox" v-model="show[key]"><i></i>{{ label }}
          </label>
          <label class="switch"><input type="checkbox" v-model="follow"><i></i>跟随最新</label>
          <!-- 垂直标签页（sessions.sideTabs，设备级，默认关）：标签页竖着列在侧边栏「最近」上面。
               上面个人设置里开了底部标签页才能开，没开时灰着点不了；和底部标签页开关一样，游客、旧后端没有 -->
          <label v-if="typeof globalSettings.bottomTabs === 'boolean'" class="switch dep"><input type="checkbox" v-model="vertTabs"
            :disabled="!keepTabs"><i></i>垂直标签页</label>
          <label class="switch">
            <input type="checkbox" v-model="mmMine"><i></i>折叠刻度盘
          </label>
          <label class="switch">
            <input type="checkbox" v-model="mdUser"><i></i>渲染我的消息（Markdown 和公式）
          </label>
          <div class="dd-title">性能</div>
          <!-- 开关和「留几个」排在同一行：最近看过的这几个标签页留着画好的内容，更早的切走就释放。
               开关和别的开关一样贴在最右边，下拉框让在它左边：label 拆开（display: contents）、按 order 排 -->
          <div class="switch-pick">
            <label class="switch"><input type="checkbox" v-model="perf.keepAlive"><i></i><span>标签页常驻</span></label>
            <ui-select v-model="perf.keepMax" :disabled="!perf.keepAlive" aria-label="常驻几个"
                       :options="Object.entries(KEEP_CHOICES).map(([n, label]) => ({ value: +n, label }))"></ui-select>
          </div>
          <label class="switch">
            <input type="checkbox" v-model="perf.noSkip"><i></i>屏幕外不跳过渲染
          </label>
          <!-- 主题色永远排在设置卡片的最后一组：以后新增的本地偏好都加在它前面，全局设置加在最上面那组里 -->
          <div class="dd-title">主题色</div>
          <!-- 开着二次元风格界面时是一排按各自主题换好色的小小蓝白，选中的会动、一直举点赞牌（xxlb.js 的 XxlbThemes）；关着是原来的圆点 -->
          <xxlb-themes v-if="feature('persona')" :themes="THEMES" :theme="theme" @pick="theme = $event"></xxlb-themes>
          <div v-else class="swatches">
            <button v-for="(label, key) in THEMES" :key="key" class="swatch" :class="{ on: theme === key }"
                    :data-theme="key" :aria-label="label" @click="theme = key"></button>
          </div>
          <!-- 小小蓝白的出处：上面个人设置里没有二次元开关的人（游客、单用户实例、旧后端，新会话页上照样有她）写在这里，条件和那组一致 -->
          <xxlb-credit v-if="!(!readonly && me.multi && me.name && globalSettings.features)" class="tail-credit"></xxlb-credit>
          </teleport>
    </div>
    </teleport>
  </header>

  <!-- 侧边栏（左上角打开，sessions.js 的 sideOpen）：从左边滑出来，右边留一条缝露出底下的页面（压暗），
       点那条缝、按 Esc 收起，挑了会话、开了新会话、搜索也收起。
       整张是一个滚动区（.side-scroll），顶上一条、底下一条固定在它上面，内容从它们底下滚过去。会话那一页（照 Gemini）：
       顶上是 CC viewer、搜索（找话弹窗，默认在全部会话里找）、收起（宽屏才有），下面一整行宽的「新会话」药丸，整块实心，列表在药丸下沿淡出；
       底下左边头像和名字、右边齿轮，都进账号页（用户反馈齿轮不要直接进设置）。
       三层（sideView）：会话那一页（main）只有「最近」的会话；账号页（me），一张列表：余额（账本）、人设卡、设备、余额看板、
       用户管理、流量、设置、改密码、退出；设置页（set）
       放不常改的（默认账号、显示、性能、主题色），只从账号页列表里的「设置」进，返回回到账号页。
       账号页、设置页的顶上那条换成返回和标题、渐变透明，底下那条不显示。
       会话这一页没有「打开全部会话」的入口（用户反馈没有意义了，「最近」里已经是自己的全部会话）；
       要管理会话从账号页列表里的「管理会话」进。
       最近的会话和设置写在看板那段模板里，由 teleport 搬过来（#side-recent、#side-settings），所以这里一直留着、只是藏起来。
       从账号页打开的账本、设备这些弹窗盖在侧边栏上面，关了回到账号页 -->
  <transition name="side-in" :duration="260">
  <!-- 手机上在对话区往右拖跟手拉出它（拖的时候 sideDrag 让它先露出来），在它上面往左拖跟手收起（app.js 的 startSideDrag、onSideTouchMove） -->
  <div v-show="sideOpen || sideDrag" class="side-wrap" @touchstart.passive="onSideTouchStart" @touchmove.passive="onSideTouchMove"
       @touchend.passive="onSideTouchEnd" @touchcancel.passive="onSideTouchCancel" @click.capture="onSideClickCapture">
  <div class="side-shade" @click="sideOpen = false"></div>
  <!-- 账号页、设置页铺满全屏（full），会话那一页右边留缝 -->
  <!-- with-todo：「新会话」底下多一颗「待办」，顶上那块实心的高出一截，列表跟着往下让 -->
  <aside class="side" :class="{ full: sideView !== 'main', 'with-todo': !readonly && me.todos }" aria-label="侧边栏">
    <!-- 阴影单独一层（style.css 的 .side-glow），收着、拉出来时跟着压暗的那层淡入淡出 -->
    <i class="side-glow" aria-hidden="true"></i>
    <div class="side-scroll" @scroll.passive="onSideScroll">
    <div v-show="sideView === 'main'" class="side-body">
      <!-- 「最近」写的是当前的筛选（筛着就换成「进行中 · 论文」这样）；右边漏斗按状态筛、标签按标签筛（app.js 的 sideStateMenu、sideTagMenu），
           筛着的那个染主题色 -->
      <!-- 垂直标签页（sessions.sideTabs）：开着的标签页按标签页栏的顺序竖着列在「最近」上面，一个一行的药丸。
           点和底部标签页同一套（sideDot），右边的叉关掉它（只从这台设备上拿掉），右键、长按是标签页菜单（tabMenu） -->
      <template v-if="sideTabs">
        <div class="dd-title side-tabs-head">标签页</div>
        <div class="side-tabs">
          <button v-for="t in tabs" :key="t.id" type="button" class="dd-item side-sess side-tab" :class="{ on: t.id === active && !td.open }"
                  @click="sideDone(); select(t)" v-longpress="e => tabMenu(e, t)"
                  @mouseenter="showTabTip($event, t, true)" @mouseleave="tabTip.tab = null">
            <i class="dot side-dot" :class="sideDot(t)"></i>
            <span class="side-title">{{ t.fresh ? t.pending?.[0]?.text || '新会话' : t.title || fileName(t.path) }}</span>
            <i class="side-more" role="button" aria-label="关闭" @click.stop="close(t)"><svg viewBox="0 0 16 16"><path
               d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></i>
          </button>
        </div>
      </template>
      <div class="side-list-head">
        <div class="dd-title">{{ sideFilterLabel }}</div>
        <button type="button" class="side-round side-mini" :class="{ on: sideFilter.state }" aria-label="按状态筛"                @click.stop="sideStateMenu($event)"><svg class="ico24" viewBox="0 0 24 24"><path
                d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z"/></svg></button>
        <button type="button" class="side-round side-mini" :class="{ on: sideFilter.tag }" aria-label="按标签筛"                @click.stop="sideTagMenu($event)"><svg class="ico24" viewBox="0 0 24 24"><path
                d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle
                cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg></button>
      </div>
      <div id="side-recent" class="side-recent"></div>
    </div>
    <!-- 账号页：一张列表，常用的入口直接点，「设置」再进一层 -->
    <div v-show="sideView === 'me'" class="side-body">
      <p v-if="!me.loaded" class="empty">{{ me.error ? `身份验证失败：${me.error}` : '正在验证身份…' }}
        <button v-if="me.error" type="button" class="mini" @click="loadMe()">重试</button></p>
      <template v-else>
        <div class="side-who"><b>{{ me.name || me.guestName }}</b><small v-if="me.admin">查看器账号</small></div>
        <!-- 设备最要紧，放在最上面、直接摊开（以前是列表第一项、要点进去）：标题右边「＋ 添加」，
             下面一台一行（图标按在线状态上色、名字、状态），点哪台打开设备面板并展开它（devices.js 的 openDevice），点标题打开整个面板 -->
        <section v-if="me.devices" class="side-devs">
          <header><button type="button" class="side-devs-title" @click="openDevices()"><svg class="side-ico" viewBox="0 0 16 16"><rect x="2"
              y="3" width="12" height="8" rx="1.2"/><path d="M6 14h4M8 11v3"/></svg><b>我的设备</b></button>
            <button type="button" class="side-devs-add" @click="addDevice()">＋ 添加<i v-if="devDot" class="rdot"></i></button></header>
          <p v-if="dev.error" class="error">{{ dev.error }}</p>
          <button v-for="p in dev.pending" :key="p.tok" type="button" class="side-dev" @click="openLink(p.tok)">
            <span class="dev-icon" :class="pendingIcon(p)"><svg v-if="p.error" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path
              d="M8 4.8v3.6M8 11h.01"/></svg><svg v-else-if="p.stuck" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path
              d="M8 4.5V8l2.4 1.6"/></svg><svg v-else viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 1-6 6"/></svg></span>
            <span class="side-dev-main"><b>正在添加电脑</b><small :class="{ neg: p.error }">{{ pendingText(p) }}</small></span></button>
          <button v-for="d in dev.devices" :key="d.name" type="button" class="side-dev" @click="openDevice(d)">
            <span class="dev-icon" :class="devState(d).cls"><svg v-if="d.kind === 'pc'" viewBox="0 0 16 16"><rect x="2" y="3" width="12"
              height="8" rx="1"/><path d="M6 14h4M8 11v3"/></svg><svg v-else viewBox="0 0 16 16"><rect x="3" y="2" width="10" height="5"
              rx="1"/><rect x="3" y="9" width="10" height="5" rx="1"/><path d="M5.5 4.5h.01M5.5 11.5h.01"/></svg></span>
            <span class="side-dev-main"><b>{{ d.name }}</b><small class="dev-state" :class="devState(d).cls">{{ devState(d).text }}</small></span>
            <i class="side-chev"></i></button>
          <p v-if="!dev.devices.length && !dev.pending.length && !dev.error" class="side-devs-empty">{{ dev.loading ? '正在加载…'
            : '暂无设备。添加电脑或服务器后，在对话中提及其名称，Claude 即可在其上操作' }}</p>
        </section>
        <!-- 每项前面一个线条图标，同一套画法：16 格画布、1.5 粗、圆头 -->
        <div class="side-list">
          <!-- 管理会话：「全部会话」那一页（卡片墙、按工作区分组、标签、已删除），用户反馈的 -->
          <button type="button" class="side-row" @click="sideDone(); openOverview()">
            <svg class="side-ico" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5"
              height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></svg>
            <span>管理会话</span><i class="side-chev"></i></button>
          <!-- 余额（改成一张图）：标题一行写此刻的余额，下面最近 30 天的余额曲线（stats.js，每小时一个点，
               最底下是 0、最高处是最大值），按住拖着看某一刻的余额；点了打开账本。旧后端没有曲线接口，照旧是一行 -->
          <button v-if="showBalance && !bal.unsupported" type="button" class="side-card" @click="openLedger()">
            <span class="side-plans-head"><svg class="side-ico" viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="9" rx="1.5"/><path
              d="M2 7h9.5M11 10h.01"/><path d="M4 4l6-2 1 2"/></svg><b>余额</b><b class="side-card-num" :class="{ neg: me.balance < 0 }">{{ fmtPts(me.balance) }}</b></span>
            <line-chart v-if="bal.data" :series="[{ key: 'b', label: '余额', values: bal.data.values, cls: 'me', area: true }]"
                        :times="bal.data.times" :fmt="v => money(v)" :height="78" idle="最近 30 天"></line-chart>
            <small v-else class="side-card-note" :class="{ neg: bal.error }">{{ bal.error || '正在加载…' }}</small>
          </button>
          <button v-else-if="showBalance" type="button" class="side-row" @click="openLedger()">
            <svg class="side-ico" viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="9" rx="1.5"/><path d="M2 7h9.5M11 10h.01"/><path d="M4 4l6-2 1 2"/></svg>
            <span>余额</span><small :class="{ neg: me.balance < 0 }">{{ fmtPts(me.balance) }}</small><i class="side-chev"></i></button>
          <!-- 额度计划（plan.js）：查看器账号给的按周分期发放，还在发的每个一条进度条，紧挨着余额；
               点了打开账本（发了的那几期在账本里一笔笔列着）。旧后端不给 plans 就没有这块 -->
          <button v-if="me.plans?.length" type="button" class="side-plans" @click="openLedger()">
            <span class="side-plans-head"><svg class="side-ico" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="11" rx="1.5"/>
              <path d="M2 6.5h12M5.5 1.8v2.4M10.5 1.8v2.4M5 10l1.8 1.6L11 8.5"/></svg><b>额度计划</b><small>每 {{ me.plans[0].days }} 天发放一次</small></span>
            <grant-plan v-for="p in me.plans" :key="p.id" :plan="p"></grant-plan>
          </button>
          <!-- 我的号（stats.js）：自己是号主的号一个一张，和额度计划差不多大。能用的在前、最近用过的在前，
               手机上露两个、宽屏露三个，其余点「展开全部」。每张写 5 小时和本周还剩多少、开通到到期走到哪了、自己和别人各在上面花了多少；
               点了打开这个号的预定面板（和账号表里右键、长按一样）。旧后端没有接口、或者名下没有号，就没有这块 -->
          <section v-if="ownedRows.length" class="side-card side-owned">
            <span class="side-plans-head"><svg class="side-ico" viewBox="0 0 16 16"><circle cx="5.5" cy="8" r="3"/><path
              d="M8.5 8H14M12 8v2.5M14 8v2"/></svg><b>我的号</b><small>{{ ownedRows.length }} 个</small></span>
            <transition-group name="own" tag="div" class="own-list">
              <button v-for="o in ownedShown" :key="o.name" type="button" class="own-card" :class="{ dead: o.status }" @click="openReserve(o.name)">
                <span class="own-head"><acct-tag :name="o.name" :family="acctFamily(o.name)" color></acct-tag>
                  <b v-if="o.status" class="paid-mark">{{ o.status }}</b>
                  <small v-else-if="o.q.weekOut" class="own-dim">本周已用尽{{ o.q.week?.reset ? `，${o.q.week.reset} 重置` : '' }}</small>
                  <small v-else-if="o.q.balance" class="own-dim">{{ o.q.balance.text }}</small>
                  <small v-else class="own-dim">{{ o.last ? `${ago(o.last)}用过` : '还没人用过' }}</small></span>
                <span v-if="!o.status && !o.q.weekOut && (o.q.five || o.q.week)" class="own-bars">
                  <span v-if="o.q.five" class="own-bar"><small>5 小时</small><i><i :class="o.fiveTier" :style="{ width: o.q.five.rest + '%' }"></i></i><b>{{ o.q.five.value }}</b></span>
                  <span v-if="o.q.week" class="own-bar"><small>本周</small><i><i :class="o.weekTier" :style="{ width: o.q.week.rest + '%' }"></i></i><b>{{ o.q.week.value }}</b></span>
                </span>
                <span v-if="o.exp" class="own-life"><i><i :style="{ width: o.life + '%' }"></i></i>
                  <small><span>开通 {{ dayText(o.start) }}</span><span>{{ o.status ? `${dayText(o.exp)} 到期` : `${dayText(o.exp)} 到期 · 还剩 ${o.left} 天` }}</span></small></span>
                <span class="own-money"><span>自己用了 <b>{{ money(o.self) }}</b></span><span>别人用了 <b>{{ money(o.others) }}</b><small
                  v-if="o.users"> · {{ o.users }} 人</small></span></span>
              </button>
            </transition-group>
            <button v-if="ownedRows.length > ownedMax" type="button" class="own-more" @click="ownedOpen = !ownedOpen">{{ ownedOpen ? '收起'
              : `展开全部 ${ownedRows.length} 个号` }}</button>
          </section>
          <p v-if="owned.error" class="error side-card-note">{{ owned.error }}</p>
          <!-- 用量（stats.js）：最近 3 天每小时花了多少（按单价），点进去是用量统计页 -->
          <button v-if="me.name && !mini.unsupported" type="button" class="side-card" @click="openUsage()">
            <span class="side-plans-head"><svg class="side-ico" viewBox="0 0 16 16"><path d="M2 13.5h12M3 11l3-4 2.5 2.5L13 4"/></svg><b>用量</b><small
              v-if="mini.data">3 天 {{ money(mini.data.profile.full || 0) }}</small><i class="side-chev"></i></span>
            <line-chart v-if="mini.data" :series="[{ key: 'u', label: '每小时', values: mini.data.series.full, cls: 'me', area: true }]"
                        :t0="mini.data.t0" :step="mini.data.step" :fmt="v => money(v)" :height="64" idle="最近 3 天每小时的花费"></line-chart>
            <small v-else class="side-card-note" :class="{ neg: mini.error }">{{ mini.error || '正在加载…' }}</small>
          </button>
          <button v-if="me.personas" type="button" class="side-row" @click="openPersonas()">
            <svg class="side-ico" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><circle cx="6" cy="7" r="1.4"/>
              <path d="M3.8 11c.5-1.1 1.2-1.7 2.2-1.7s1.7.6 2.2 1.7M10 6.5h2M10 9h2"/></svg>
            <span>人设卡</span><i class="side-chev"></i></button>
          <a v-if="!readonly && accounts.some(a => a.apiAccess)" class="side-row" href="api-access.html" target="_blank" rel="noopener" style="text-decoration:none">
            <svg class="side-ico" viewBox="0 0 16 16"><circle cx="5.5" cy="5.5" r="3"/><path d="M7.7 7.7 13 13m-2-2 1.5-1.5M9.5 9.5 11 8"/></svg>
            <span>API 密钥</span><i class="side-chev"></i></a>
          <button v-if="me.multi && me.paid.length" type="button" class="side-row" @click="openBoard()">
            <svg class="side-ico" viewBox="0 0 16 16"><path d="M3 13V8.5M8 13V3.5M13 13V6.5M2 13.5h12"/></svg>
            <span>余额看板</span><i class="side-chev"></i></button>
          <button v-if="me.admin && (me.multi || me.paid.length)" type="button" class="side-row" @click="admin.sel = ''; openAdmin()">
            <svg class="side-ico" viewBox="0 0 16 16"><circle cx="6" cy="5.5" r="2.2"/><path d="M2.3 13c.6-2.3 2-3.5 3.7-3.5s3.1 1.2 3.7 3.5"/>
              <path d="M10.6 3.4a2.1 2.1 0 0 1 0 4.2M11.8 9.8c1 .5 1.6 1.6 1.9 3.2"/></svg>
            <span>用户管理</span><i class="side-chev"></i></button>
          <button v-if="me.admin" type="button" class="side-row" @click="openTraffic()">
            <svg class="side-ico" viewBox="0 0 16 16"><path d="M5 13V3M2.5 5.5 5 3l2.5 2.5M11 3v10M8.5 10.5 11 13l2.5-2.5"/></svg>
            <span>流量</span><i class="side-chev"></i></button>
          <button type="button" class="side-row" @click="sideView = 'set'">
            <!-- 和底下齿轮按钮同一个（Lucide 的 settings，24 格画布，线宽按它另算） -->
            <svg class="side-ico side-ico24" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            <span>设置</span><i class="side-chev"></i></button>
          <!-- 头像（avatar.js）：前面画现在的头像，没传过直接选图，传过了先弹菜单（换一张、恢复成文字头像）；旧后端不给 avatar 就没有这一行 -->
          <button v-if="me.multi && me.name && me.avatar !== undefined" type="button" class="side-row" :disabled="avatarBusy" @click="avatarRow($event)">
            <i class="side-avatar side-ico-avatar"><img v-if="avatarSrc" :src="avatarSrc" alt=""><template v-else>{{ me.name.slice(0, 1) }}</template></i>
            <span>头像</span><small v-if="avatarBusy">正在上传…</small><i class="side-chev"></i></button>
          <!-- 改密码、退出登录接在同一张列表里，间距和上面一样（用户反馈以前另起一组、中间空一大截没必要） -->
          <button v-if="me.multi && me.name" type="button" class="side-row" @click="openPassword()">
            <svg class="side-ico" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
            <span>修改密码</span><i class="side-chev"></i></button>
          <button v-if="me.multi && me.name" type="button" class="side-row side-danger" :disabled="loggingOut" @click="logout()">
            <svg class="side-ico" viewBox="0 0 16 16"><path d="M6 2.5H3.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1H6M10.5 5l3 3-3 3M13.5 8H6"/></svg>
            <span>{{ loggingOut ? '正在退出…' : '退出登录' }}</span></button>
        </div>
      </template>
    </div>
    <div v-show="sideView === 'set'" class="side-body">
      <div id="side-settings" class="side-settings"></div>
    </div>
    </div>
    <!-- 顶上那条（固定）：会话那一页（照 Gemini）是 CC viewer、搜索、收起（宽屏才有），下面一整行宽的「新会话」药丸，
         整块实心不透明，列表滚上去在药丸下沿淡出（scrolled：滚下去了才露出那条淡出）；账号页、设置页是返回和标题，照旧渐变透明 -->
    <header class="side-top" :class="{ scrolled: sideScrolled }">
      <template v-if="sideView === 'main'">
        <div class="side-head">
          <strong class="side-brand">CC viewer</strong>
          <button type="button" class="side-round" aria-label="搜索会话" @click="sideDone(); openSearch('all')">
            <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4"/><path d="M10 10l3.5 3.5"/></svg></button>
          <button v-if="sideWide" type="button" class="side-round" aria-label="收起侧边栏" @click="sideOpen = false">
            <svg class="ico24" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></button>
        </div>
        <button v-if="!readonly" type="button" class="side-new" @click="sideDone(); openFresh()">
          <svg class="ico24" viewBox="0 0 24 24"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>新会话</button>
        <!-- 待办（todos.js）：紧挨着新会话，点了主区域换成待办页；开着时垫主题色浅底，右边写几条在做。
             后端没有待办（/api/me 不给 todos）就没有这颗 -->
        <button v-if="!readonly && me.todos" type="button" class="side-new side-todo" :class="{ on: td.open }" @click="sideDone(); openTodos()">
          <svg class="ico24" viewBox="0 0 24 24"><path d="M3.5 6.5l1.8 1.8 3.2-3.4M3.5 15.5l1.8 1.8 3.2-3.4M12 7h8.5M12 16h8.5"/></svg>待办<small
            v-if="counts.doing">{{ counts.doing }} 工作中</small></button>
      </template>
      <template v-else>
        <button type="button" class="side-round side-back" aria-label="返回" @click="sideView = sideView === 'set' ? 'me' : 'main'">
          <svg viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg></button>
        <strong>{{ sideView === 'set' ? '设置' : '账号' }}</strong>
      </template>
    </header>
    <!-- 底下那条（固定、实心，只在会话那一页，照 Gemini）：左边头像（主题色圆里写名字头一个字）和名字，点了进账号页；
         右边齿轮也进账号页（设置页在账号页列表里）。上面还有会话没滚出来时，上沿露出一条淡出（more） -->
    <footer v-show="sideView === 'main'" class="side-foot" :class="{ more: sideMoreBelow }">
      <button type="button" class="side-me" @click="sideView = 'me'">
        <i class="side-avatar"><img v-if="me.name && avatarSrc" :src="avatarSrc" alt=""><template v-else>{{ (me.name || me.guestName || '?').slice(0, 1) }}</template></i><span>{{ me.name || me.guestName }}</span></button>
      <button type="button" class="side-round side-gear-btn" aria-label="账号" @click="sideView = 'me'">
      <!-- 齿轮：Lucide 图标库的 settings（ISC 许可），24 格画布 -->
      <svg class="side-gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      <i v-if="devDot" class="rdot corner"></i>
      </button>
    </footer>
  </aside>
  </div>
  </transition>

  <template v-if="current">
    <div class="logwrap">
      <!-- 新会话页底下的主题色云（照 Gemini 的光晕，至少三朵）：打开新会话页时从输入框底下一朵接一朵呼出来、铺开就停；
           垫在所有对话区的后面（.logwrap 里排在它们前面），换到另一个新会话标签页重放一遍。说出第一句话就淡掉，会话建成就没了 -->
      <div v-if="current.fresh && !td.open" :key="current.id" class="fresh-clouds" :class="{ gone: current.busy || current.pending.length }"
           aria-hidden="true"><i></i><i></i><i></i></div>
      <!-- 每个标签各留一份渲染好的内容，切换只是显示/隐藏，不重建；展开折叠、图片加载会改变高度，刻度尺跟着重算 -->
      <template v-for="tab in tabs" :key="tab.id">
      <main v-if="keepShown(tab)" :class="{ off: tab.id !== active && tab.id !== slide.from, cv: !perf.noSkip,
                                           'slide-in': slide.to === tab.id, 'slide-out': slide.from === tab.id, back: slide.dir < 0,
                                           'fresh-page': freshPage(tab), 'fresh-gone': freshGone(tab) }"
            :ref="el => setLog(tab, el)" :data-tab="tab.id"
            class="log" @scroll="onScroll" @wheel.passive="onWheel" @toggle.capture="mmSoon" @load.capture="mmSoon"
            @touchstart.passive="onTouchStart" @touchend.passive="onTouchEnd" v-on="keepTabs || !sideWide ? dragOn : {}">
        <!-- 输入框上面的全部内容包一层：至少撑满「对话区减去输入框」那么高，内容很短时输入框也贴在最底下 -->
        <div class="log-body">
        <!-- 新会话标签页：发出第一句话之前，工作区、标签、账号都还能改 -->

          <template v-for="none in [!accountGroups.available.length]" :key="'accts'">

            <template v-if="!none && accountGroups.unavailable.length && (tab.acctOpen || !picked)">

          </template>

        </section>
        <!-- 长会话只先画末尾几百条，往上滚会自动把更早的接上来；撑不满一屏时会自动补满，点这行也能补一段。

        <p v-if="tab.offset" class="empty earlier" @click="fetchEarlier()">

                  :data-idx="i" :data-seq="item.seq" @open="addTab"></item-row>

        <p v-if="tab.loadError" class="empty error load-err">内容加载失败：{{ tab.loadError }}

        <p v-if="tab.cut" class="empty later" @click="fetchLater()">

        <template v-if="!tab.cut">

        <!-- 这一轮结束了但后台还挂着任务（后台命令、后台子代理）：结束后 Claude 会自己接着说，挂着期间也不会被空闲回收。
             这两行用不动的小钟、没有进度条（会动的状态会让人以为这一轮还在干活，发话就成了插话或打断） -->
        <div v-if="!tab.running && tab.bg?.length" class="row working bg-work">

        <div v-if="!tab.running && tab.wake" class="row working bg-work">

        <div v-if="!tab.running && tab.autoGo" class="row working auto-go">
          <label class="switch auto-go-switch"><input type="checkbox" :checked="tab.autoGo.on" :disabled="readonly || tab.autoGoBusy"

             不转圈（转圈和进度条扫光重复了），动的只有进度条当前那格。整块固定两行高，话再长也不折行、不把会话区顶得跳：

        <div v-if="tab.running" class="row working work-now">

              <div class="work-clip">

                    <small v-if="w.sec" class="work-sec" :class="{ 'work-warn': w.warn }">· {{ w.sec }}</small>
                  </div>

              <transition name="work-tip">

            <div class="work-steps" :class="{ lost: w.step.lost }">

            </div>
          </template>
        </div>

        <div v-for="s in tab.staged" :key="s.id" class="row staged">

            <div class="plain">{{ s.text }}</div>
          </div>
        </div>
        </template>
        </div>
        <!-- 对话框：放在滚动区里、贴底悬浮，左右边缘自然和气泡对齐；只读模式没有 -->
        <!-- 别人的公开会话：只有它所属的用户能往里发话（后端同样拦，见 users.use_why） -->
        <p v-if="!readonly && useBlock(tab)" class="composer composer-off">{{ useBlock(tab) }}</p>
        <form v-else-if="!readonly" class="composer" @submit.prevent="sendChat" @dragover.prevent @drop.prevent="onDropFiles">
          <!-- 粘贴或拖进来、还没发出去的图 -->
          <div v-if="tab.attach.length" class="attachs">
            <span v-for="(a, i) in tab.attach" :key="i" class="attach">
              <img :src="a.url">
              <button type="button" aria-label="移除图片" @click="tab.attach.splice(i, 1)">×</button>
            </span>
          </div>
          <!-- 回形针传的文件：传的时候底下一条进度，传好了打勾，没传成写原因（chat.js 的 uploadFiles） -->
          <div v-if="tab.files.length" class="upfiles">
            <span v-for="(f, i) in tab.files" :key="i" class="upfile" :class="{ bad: f.error, done: f.path }">
              <svg viewBox="0 0 16 16"><path d="M10.5 4.5 5.4 9.6a1.4 1.4 0 0 0 2 2l5.3-5.3a2.8 2.8 0 0 0-4-4L3.3 7.7a4.2 4.2 0 0 0 6 6l4.2-4.2"/></svg>
              <span class="upfile-name">{{ f.name }}</span>
              <span class="upfile-note">{{ f.error ? `上传失败：${f.error}` : f.path ? fileSize(f.size)
                : `${Math.floor(100 * f.loaded / Math.max(f.size, 1))}%` }}</span>
              <i v-if="!f.path && !f.error" class="upfile-bar" :style="{ width: `${100 * f.loaded / Math.max(f.size, 1)}%` }"></i>
              <button type="button" :aria-label="f.xhr ? '取消上传' : '移除文件'" @click="dropFile(tab, i)">×</button>
            </span>
          </div>
          <p v-if="tab.failed" class="composer-err">
            <span>发送失败：{{ tab.failed.error }}</span>
            <button type="button" class="mini" @click="retrySend()">重试</button>
            <button type="button" class="mini" @click="restoreFailed(tab)">放回输入框</button>
            <button type="button" class="mini" @click="tab.failed = null">忽略</button>
          </p>
          <p v-else-if="tab.chatError" class="composer-err">{{ tab.chatError }}</p>
          <!-- 离上一次请求超过一小时（DeepSeek 号不按时间提醒），或者选中的号和上一次回复的号不一样（chat.js 的 cacheNote）：
               提醒缓存已失效 / 换了号不通用、再发要重新写入，顶替输入框空着时的提示，
               不再单独占一行（更早以前悬浮在输入框上方，挡住最后一个气泡又关不掉）。
               原生的提示只能是一种颜色，「已失效」和金额要用计费的红色，所以提示照旧写进 placeholder（chat.js 的 fitButtons 按它量会不会碰到按钮），
               但字设成透明，上面叠一行同样位置、同样字号的 .cache-hint 来显示；打了字就和原生提示一样消失 -->
          <!-- 打「/」开头时输入框上方的指令卡片（chat.js 的 cmdMenu）：点一项填进输入框；按下时不抢输入框的焦点，手机上键盘不收 -->
          <template v-for="m in [cmdMenu(tab)]" :key="'cmds'">
          <transition :css="false" @leave="cardShrink">
          <div v-if="m" class="cmd-card" @mousedown.prevent @vue:mounted="cardGrow" @vue:updated="cardGrow">
            <button v-for="c in m.items" :key="c.name" type="button" class="cmd-item" @click="pickCmd(tab, c)"><b>/{{ c.name }}</b><small
              v-if="c.hint">{{ c.hint }}</small><span v-if="c.desc">{{ c.desc }}</span></button>
            <p v-if="m.why" class="cmd-why">{{ m.why }}</p>
          </div>
          </transition>
          <!-- 从待办页开出的新会话（todos.js 的 sendPicked）：要发给 Claude 的那段说明画成同样的卡片，不占输入框；
               发出去时拼在用户的话前面（chat.js 的 deliver），发送中、打「/」叫出指令卡片时先收起；× 是这次不从待办开出 -->
          <transition :css="false" @leave="cardShrink">
          <div v-if="tab.fresh && tab.todoNote && !m && !tab.sending" class="cmd-card todo-note" @vue:mounted="cardGrow" @vue:updated="cardGrow">
            <p>{{ tab.todoNote.text }}</p>
            <button type="button" class="todo-note-x" aria-label="不从待办开出" @mousedown.prevent @click="dropTodoNote(tab)">×</button>
          </div>
          </transition>
          </template>
          <template v-for="n in [cacheNote(tab)]" :key="'cache'">
          <textarea :ref="el => tab.id === active && (composerInput = el)" v-model="tab.draft" rows="1" :class="{ 'cache-ph': n }"
                    @input="tab.typed = $event.target.value; autoGrow()" @keydown.enter.exact="onEnter" @keydown.tab.exact="onCmdTab" @paste="onPaste"
                    @compositionstart="tab.typed = $event.target.value; tab.composing = true" @compositionend="tab.composing = false"
                    :placeholder="tab.fresh ? askHint(tab) : n ? n.lead + n.mark + n.tail + (n.cost || '价格未知（该模型暂无单价）') : composerHint"></textarea>
          <!-- 输入法还没上屏的拼音字母不进 v-model（tab.draft 还是空的），要另外认 composing，不然提示压在拼音上 -->
          <span v-if="n && !tab.draft && !tab.composing" class="cache-hint" aria-hidden="true">{{ n.lead }}<em>{{ n.mark }}</em>{{ n.tail }}<em>{{ n.cost || '价格未知（该模型暂无单价）' }}</em></span>
          </template>
          <!-- 添加图片和传文件收进左下角一个没有边框的「＋」，点开是自己画的小菜单（不是系统的选单），
               两项点的是下面两个藏起来的选文件框（选图片、回形针）。挂 dd 是为了点别处时由 sessions.js 那个监听收起 -->
          <div class="dd plus-dd" :class="{ on: openDd === 'plus' }">
            <button type="button" class="plus-btn" aria-label="添加图片或文件" @click.stop="toggleDd('plus')">
              <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
            </button>
            <div v-if="openDd === 'plus'" class="plus-menu" role="menu">
              <button type="button" class="dd-item" role="menuitem"
                      @click="openDd = ''; $event.currentTarget.closest('.composer').querySelector('.pick-img').click()">
                <span><svg viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><circle cx="6" cy="6.5" r="1"/><path d="m2.5 11.5 3.5-3.5 3 3 1.5-1.5 3 3"/></svg>图片</span></button>
              <button type="button" class="dd-item" role="menuitem" @click="pickUpload($event); openDd = ''">
                <span><svg viewBox="0 0 16 16"><path d="M10.5 4.5 5.4 9.6a1.4 1.4 0 0 0 2 2l5.3-5.3a2.8 2.8 0 0 0-4-4L3.3 7.7a4.2 4.2 0 0 0 6 6l4.2-4.2"/></svg>文件</span></button>
            </div>
          </div>
          <!-- 按钮浮在右下角，和文字互相让：文字占满整宽，最后几行碰到按钮时按钮挪到文字下面（chat.js 的 fitButtons） -->
          <div class="composer-btns">
          <!-- 选图片：手机上没法拖、也粘不进图，只能靠它；安卓上点开能直接拍照 -->
          <input type="file" class="pick-img" accept="image/*" multiple hidden @change="onPickFiles">
          <!-- 回形针：什么文件都能传，存到服务器上这个会话的上传目录，发话时告诉 Claude 放在哪。
               accept 写成 */*：不写的话，谷歌手机上的 Chrome 只打开系统的照片选择器，选不了别的文件 -->
          <input type="file" class="pick-any" accept="*/*" multiple hidden @change="onPickAny">
          <!-- 只添加不发送：先存成一条待发的话（空心气泡），点发送时一起发出。
               先藏起来（加了回形针，按钮太挤），功能和接口都留着，把 false && 去掉就回来了 -->
          <button v-if="false && !tab.fresh" type="button" class="icon-btn stage" aria-label="只添加不发送"
                  :disabled="!tab.draft.trim() || tab.staging" :class="{ busy: tab.staging }" @click="stageChat">
            <svg viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg>
          </button>
          <!-- 讯飞语音输入（voice.js）：设置里配过讯飞的人才有，点一下开始说、再点一下结束，字写进输入框不自动发。
               五根竖条像频响，说话时变成主题绿、竖条跟着音量跳（--lv 由 voice.js 直接改）；取地址、开麦克风、等最后的字时灰着。
               按下时不抢输入框的焦点，光标位置留着、手机上键盘不收 -->
          <button v-if="globalSettings.voice?.service" type="button" class="icon-btn voice"
                  :class="{ on: voiceOn(tab), busy: voiceOn(tab) && voiceRec.state !== 'live' }"
                  :aria-label="voiceOn(tab) ? '结束语音输入' : '语音输入'" @mousedown.prevent @click="toggleVoice(tab)">
            <svg viewBox="0 0 16 16"><path class="b1" d="M3 6.5v3"/><path class="b2" d="M5.5 4.5v7"/><path class="b3" d="M8 2.5v11"/><path
              class="b4" d="M10.5 4.5v7"/><path class="b5" d="M13 6.5v3"/></svg>
          </button>
          <!-- Claude 在跑的时候，只要输入框里有字就还能发：那一句会作为插话排在这一轮后面 -->
          <button v-if="!tab.running || tab.draft.trim() || tab.attach.length || tab.files.length || tab.staged.length" class="icon-btn send"
                  :aria-label="tab.running ? '插话' : '发送'"                  :disabled="!tab.draft.trim() && !tab.attach.length && !tab.files.length && !tab.staged.length && !(tab.fresh && tab.todoNote)">
            <svg viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
          </button>
          <button v-if="tab.running" type="button" class="icon-btn stop" :class="{ busy: tab.stopping }"
                  :disabled="tab.stopping" :aria-label="tab.stopping ? '正在中断' : '中断'" @click="stopChat">
            <svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.5"/></svg>
          </button>
          </div>
        </form>
        <!-- 输入框正下方一行，下看板（权限、模型、账号、上下文）由 teleport 搬到这里（app.js 的 toolsTo），
             和输入框一样贴底悬浮、在同一个滚动区里，回弹时一起动。只读模式没有输入框也要这一行：
             不然小标签留在下看板原处，那里在简洁模式的样式里不贴底，悬在对话区半中间。
             别人的会话只能看（useBlock）时也一样要画：以前不画，小标签留在原处撑掉半屏（开分享链接时会碰到） -->
        <div class="tools-slot" :id="'tools-' + tab.id"></div>
      </main>
      </template>
      <!-- 跟手翻页时，要露出来的标签页已经收掉、没有画好的内容，就先拿这一页顶上（app.js 的 pageEl），停在它上面以后再加载 -->
      <div v-for="id in peeks" :key="id" class="log log-peek" :data-peek="id"><p>正在打开…</p></div>
      <!-- 待办页（todos.js、服务器 todos.py）：对话区里的一种页面，和新会话页、会话同级（不是能叉掉的弹窗）。
           盖在各对话区上面、顶上浮着的圆按钮底下：左上角照旧开侧边栏，往右划照旧拉出侧边栏（和对话区同一套 onTouchStart / onTouchEnd），
           侧边栏里挑会话、开新会话就换走。顶上一行标题和三个筛选，下面一颗输入框，打字回车就新建一条，新建的那条当场展开。
           按分组列成紧凑的一行行，下级缩进列在上级底下；做完、不做了的折在最底下「已完成」。左边圆圈多选，底下浮出「发送到新会话」。
           条目是用户工作区里的文件（todos.py 开头），一份清单当成一个分组，没有层级、分组和父项可改；
           页面上的改动攒着，标「待同步」，AI 下次读清单时写进文件 -->
      <section v-if="td.open" class="todo-page" aria-label="待办" @click="closePops()" @scroll.passive="onTodoScroll"
               @touchstart.passive="onTouchStart" @touchend.passive="onTouchEnd" v-on="keepTabs || !sideWide ? dragOn : {}">
        <div class="todo-col">
          <header class="todo-head">
            <strong>待办</strong>
            <span class="todo-filters">
              <button v-for="f in [['all', '全部', counts.all], ['doing', '工作中', counts.doing], ['due', '有时限', counts.due]]" :key="f[0]" type="button"
                      class="todo-fp" :class="{ on: td.filter === f[0] }" @click="td.filter = f[0]">{{ f[1] }} {{ f[2] }}</button>
            </span>
          </header>
          <form class="todo-add" @submit.prevent="quickAdd()">
            <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
            <input v-model="td.draft" :maxlength="td.max.title" placeholder="新建待办，回车保存" autocomplete="off" enterkeyhint="done">
            <button v-if="td.draft.trim()" class="todo-add-btn" :disabled="td.busy === 'add'">{{ td.busy === 'add' ? '正在添加…' : '添加' }}</button>
          </form>
          <p v-if="td.error" class="error todo-msg">{{ td.error }} <button type="button" class="mini" @click="loadTodos()">重试</button></p>
          <p v-else-if="!td.loaded" class="todo-msg">正在加载…</p>
          <p v-else-if="!sections.length && !td.lists.some(x => x.error)" class="todo-msg">{{ td.items.length ? '无符合筛选的待办'
            : td.listsKnown && !td.lists.length ? '还没有登记待办清单' : '暂无待办' }}<button v-if="td.listsKnown && !td.lists.length" type="button"
            class="mini todo-fix" @click="fixList(null)">让 AI 新建一份</button></p>
          <!-- 一份清单里有文件不符合格式，这份就不列条目（todos.py 的 overview），只说哪里不对（不符合就空着说不符合，给 AI 去修） -->
          <p v-for="l in td.lists.filter(x => x.error)" :key="'err:' + l.name" class="error todo-msg">清单「{{ l.name }}」显示不了：{{ l.error }}<button
             type="button" class="mini todo-fix" @click="fixList(l)">让 AI 修好</button></p>
          <template v-for="g in sections" :key="g.name">
            <div class="todo-gh" @click="toggleSection(g.name)"><span>{{ g.label }}</span><span>{{ g.rows.length }} {{ td.shut[g.name] ? '▸' : '▾' }}</span></div>
            <transition name="todo-fold">
            <transition-group v-if="!td.shut[g.name]" tag="div" name="todo-row" class="todo-grp">
              <div v-for="r in g.rows" :key="r.it.id" class="todo-row"
                   :class="{ open: td.expanded === r.it.id, fresh: td.fresh === r.it.id, closed: g.name === '__done', sub: r.depth > 0 }"
                   :style="{ '--depth': r.depth }">
                <button type="button" class="todo-ck" :class="{ on: td.picked.includes(r.it.id) }" :disabled="g.name === '__done'"
                        :aria-label="td.picked.includes(r.it.id) ? '取消选择' : '选择'" @click="togglePick(r.it)"><svg viewBox="0 0 12 12"><path
                        d="M2.5 6.2l2.3 2.3 4.7-5"/></svg></button>
                <!-- 标题只有这一行：展开时右边一支铅笔，点了就地换成输入框（回车、点开别处存，Esc 不存） -->
                <!-- 点一行：有折着的子项先展开子项，再点一次才展开这条来改（todos.js 的 clickRow）；标题右边「几个子项」点了收起、展开子项 -->
                <div class="todo-main" @click="editing(r.it, 'title') || clickRow(r)">
                  <div class="todo-tr">
                    <input v-if="editing(r.it, 'title')" v-model="td.edit.text" class="todo-title-in" :maxlength="td.max.title" aria-label="标题"
                           enterkeyhint="done" @click.stop @keydown.enter.prevent="$event.target.blur()" @keydown.esc="endEdit(false)" @blur="endEdit()">
                    <span v-else class="todo-title">{{ r.it.title }}</span><i v-if="r.it.pending?.length && !editing(r.it, 'title')"
                       class="todo-pend">待同步</i><i v-if="workingOf(r.it).length && !editing(r.it, 'title')"
                       class="todo-run" aria-label="有会话正在做">▶</i>
                    <button v-if="r.kids && td.filter === 'all' && !editing(r.it, 'title')" type="button" class="todo-kids"
                            :class="{ on: td.unfold.includes(r.it.id) }" @click.stop="toggleKids(r.it)">{{ r.kids }} 个子项<svg
                            viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button>
                    <transition name="todo-fade"><button v-if="td.expanded === r.it.id && !editing(r.it, 'title')" type="button" class="todo-pen"
                       aria-label="编辑标题" @click.stop="startEdit(r.it, 'title')"><svg viewBox="0 0 16 16"><path
                       d="M10.8 2.7a1.6 1.6 0 0 1 2.3 2.3l-7.6 7.6-3 .8.8-3z"/></svg></button></transition>
                  </div>
                  <div v-if="r.it.summary && r.depth === 0 && r.it.level === 1 && td.expanded !== r.it.id" class="todo-sum">{{ r.it.summary }}</div>
                </div>
                <div class="todo-meta">
                  <span v-if="r.it.deadline && g.name !== '__done'" class="todo-due"
                        :class="{ guess: r.it.deadline.src !== 'user', soon: daysLeft(r.it.deadline) <= 7 }">{{ dueText(r.it.deadline) }}</span>
                  <span v-if="r.it.importance" class="todo-im" :class="[r.it.importance.v, { guess: r.it.importance.src !== 'user' }]">{{ TODO_IMP[r.it.importance.v] }}</span>
                </div>
                <!-- 展开：状态、重要性、时限各一根滑动药丸（点了就存，算用户定的；重要性、时限再点一次选中的那段是清掉，推断的滑块画虚线），
                     分组一颗输入框，再往下是现状、描述、进展、不清楚的事和挂着的会话 -->
                <transition name="todo-fold">
                <div v-if="td.expanded === r.it.id" class="todo-detail">
                  <p v-if="r.it.summary" class="todo-text">{{ r.it.summary }}</p>
                  <div class="todo-q"><span class="todo-ql">状态</span>
                    <div class="effort-seg todo-seg" :style="{ '--n': 5, '--i': Object.keys(TODO_STATUS).indexOf(r.it.status) }">
                      <i class="effort-thumb"></i>
                      <button v-for="(l, k) in TODO_STATUS" :key="k" type="button" :class="{ on: r.it.status === k }"
                              @click="r.it.status === k || setTodo(r.it, { status: k })">{{ l }}</button></div></div>
                  <!-- 时限排在重要前面，列表右边也是剩几天在前。月历、分组和父项的候选都浮在那一行底下（.todo-pop），不把下面往下顶 -->
                  <div class="todo-q todo-anchor" @click.stop><span class="todo-ql">时限</span>
                    <div class="effort-seg todo-seg" :class="{ guess: r.it.deadline && r.it.deadline.src !== 'user' }"
                         :style="{ '--n': 4, '--i': Math.max(0, dueIndex(r.it)) }">
                      <i class="effort-thumb" :class="{ none: !r.it.deadline }"></i>
                      <button v-for="(c, i) in DUE_CHOICES()" :key="c[0]" type="button" :class="{ on: dueIndex(r.it) === i }"
                              @click="rate(r.it, 'deadline', c[1])">{{ c[0] }}</button>
                      <button type="button" :class="{ on: dueIndex(r.it) === 3 }" @click="openCal(r.it)">{{ dueIndex(r.it) === 3
                        ? r.it.deadline.v.slice(5) : '日期' }}</button></div>
                  <!-- 点「日期」浮出月历（todos.js 的 openCal）：‹ › 翻月，点一天就存；选中的主题色圆底，今天一圈细边 -->
                  <transition name="todo-fold">
                  <div v-if="td.cal.id === r.it.id" class="todo-pop todo-cal">
                    <div class="todo-cal-head">
                      <button type="button" class="todo-cal-nav" aria-label="上个月" @click="calMove(-1)"><svg viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg></button>
                      <b>{{ td.cal.y }} 年 {{ td.cal.m + 1 }} 月</b>
                      <button type="button" class="todo-cal-nav" aria-label="下个月" @click="calMove(1)"><svg viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button>
                    </div>
                    <div class="todo-cal-grid">
                      <span v-for="w in ['一', '二', '三', '四', '五', '六', '日']" :key="w" class="todo-cal-w">{{ w }}</span>
                      <button v-for="c in calDays()" :key="c.iso" type="button" class="todo-cal-d"
                              :class="{ out: c.out, today: c.iso === todayIso(), on: c.iso === r.it.deadline?.v }" @click="pickDay(r.it, c.iso)">{{ c.d }}</button>
                    </div>
                    <div class="todo-cal-foot">
                      <button type="button" class="todo-cal-btn" :disabled="!r.it.deadline" @click="pickDay(r.it, '')">清除</button>
                      <button type="button" class="todo-cal-btn" @click="pickDay(r.it, todayIso())">今天</button>
                    </div>
                  </div>
                  </transition></div>
                  <div class="todo-q"><span class="todo-ql">重要</span>
                    <div class="effort-seg todo-seg" :class="{ guess: r.it.importance && r.it.importance.src !== 'user' }"
                         :style="{ '--n': 5, '--i': Math.max(0, Object.keys(TODO_IMP).indexOf(r.it.importance?.v)) }">
                      <i class="effort-thumb" :class="{ none: !r.it.importance }"></i>
                      <button v-for="(l, k) in TODO_IMP" :key="k" type="button" :class="{ on: r.it.importance?.v === k }"
                              @click="rate(r.it, 'importance', k)">{{ l }}</button></div></div>
                  <!-- 描述默认只露三行，点一下展开全文，再点收起 -->
                  <div v-if="r.it.body?.trim()" class="todo-body" :class="{ open: td.bodyOpen.includes(r.it.id), short: !bodyLong(r.it) }"
                       @click="bodyLong(r.it) && toggleBody(r.it)">
                    <pre>{{ r.it.body.trim() }}</pre><small v-if="bodyLong(r.it)">{{ td.bodyOpen.includes(r.it.id) ? '收起' : '展开描述' }}</small></div>
                  <div v-if="r.it.progress?.length" class="todo-sec"><small>进展</small>
                    <ul><li v-for="p in r.it.progress.slice(-5).reverse()" :key="p.t"><time>{{ clock(p.t * 1000) }}</time>{{ p.text }}</li></ul>
                    <small v-if="r.it.progress.length > 5" class="todo-more">另有 {{ r.it.progress.length - 5 }} 条更早的进展</small></div>
                  <div v-if="r.it.unknowns?.length" class="todo-sec"><small>待查明</small>
                    <ul><li v-for="(u, i) in r.it.unknowns" :key="i">{{ u.text }}<em v-if="u.how === 'check'">可查{{ u.detail ? `：${u.detail}` : '' }}</em><em
                        v-else-if="u.how === 'ask'">待确认{{ u.detail ? `（猜测：${u.detail}）` : '' }}</em></li></ul></div>
                  <!-- 网页上的改动先攒着（todos.py 的 pending），AI 下次读清单时写进文件；写进去之前这里列出来 -->
                  <div v-if="r.it.pending?.length" class="todo-sec"><small>还没写进文件</small><ul><li v-for="(p, i) in r.it.pending" :key="i">{{ p }}</li></ul></div>
                  <div v-if="r.it.dir" class="todo-sec"><small>材料</small><code>{{ r.it.dir }}</code></div>
                  <div v-if="r.it.file" class="todo-sec"><small>文件</small><code>{{ r.it.file }}</code></div>
                  <div v-for="lg in linkGroups(r.it)" :key="lg.k" class="todo-sec"><small>{{ lg.label }}</small>
                    <button v-for="x in lg.list" :key="x.sid" type="button" class="todo-sess" :class="{ gone: x.s.missing || x.s.deleted }" @click="openLinked(x.s)">
                      <i class="dot side-dot" :class="x.s.missing ? 'idle' : sideDot(x.s) === 'idle' && x.s.state ? x.s.state : sideDot(x.s)"></i>
                      <span>{{ x.s.elsewhere ? `${x.s.elsewhere} 上的会话` : x.s.missing ? '找不到的会话' : x.s.title || fileName(x.s.path) }}{{ x.s.deleted ? '（已删除）' : '' }}</span>
                      <small>{{ shortAgo(x.t) }}</small></button></div>
                </div>
                </transition>
              </div>
            </transition-group>
            </transition>
          </template>
        </div>
        <div class="todo-bar" :class="{ on: td.picked.length > 0 }"><span>已选 {{ td.picked.length }} 条</span>
          <button type="button" class="todo-cancel" @click="td.picked = []">取消</button>
          <button type="button" class="todo-send" @click="sendPicked()">发送到新会话</button></div>
      </section>
      <!-- up：刚才在往上翻。手机上两个按钮只在往上翻时浮出来（电脑上不管这个）。
           图标是箭头顶到一道横线上（到底、到顶），和发送那个单独的箭头分开：一个是翻页面，一个是发消息（用户反馈两者长得一样） -->
      <!-- 用不着时不拿掉（v-show 是一下子没了），加 gone 淡出，见 style.css 的 .to-top.gone（用户反馈滚到顶时按钮瞬间消失） -->
      <!-- 新会话标签页（current.fresh）不是对话，两个按钮都用不着：切过去时离顶、离底还是上一个标签页量的，会平白冒出来 -->
      <button class="icon-btn to-bottom" :class="{ up: scrollUp, gone: !farFromBottom || current?.fresh || td.open }" aria-label="回到底部" @click="backToBottom">
        <svg viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7.5 8 11l3.5-3.5M3.5 13.5h9"/></svg>
      </button>
      <!-- 回到顶部：上面还有没取回来的，先一次全取回来再滚上去 -->
      <button class="icon-btn to-top" :class="{ up: scrollUp, gone: !farFromTop || current?.fresh || td.open }" aria-label="回到顶部" @click="backToTop">
        <span v-if="current?.earlier" class="spinner small"></span>
        <svg v-else viewBox="0 0 16 16"><path d="M8 13.5v-8M4.5 8.5 8 5l3.5 3.5M3.5 2.5h9"/></svg>
      </button>
      <div v-if="mm.ticks.length" class="mm" :style="{ height: mm.height + 'px', '--mm-hit': mm.hit + 'px' }">
        <!-- 放不下时刻度层随窗口滑动，外面还有刻度的那一端淡出 -->
        <div class="mm-rail" :class="{ 'mm-over': mm.total > mm.height }"
             :style="{ '--fade-top': mm.offset > 0.5 ? '32px' : '0px',
                       '--fade-bottom': mm.offset < mm.total - mm.height - 0.5 ? '32px' : '0px' }"
             @click="mmClick" @mouseover="mmHover" @mouseleave="mm.preview = null">
          <div class="mm-track" :style="{ transform: `translateY(${-mm.offset}px)` }">
            <!-- 这一屏盖住的范围 -->
            <div v-if="mm.view" class="mm-view" :style="{ top: mm.view.y + 'px', height: mm.view.h + 'px' }"></div>
            <div v-for="(t, i) in mm.ticks" :key="i" class="mm-tick" :class="t.cls" :data-i="i"
                 :style="{ top: t.y + 'px', height: mm.tickH + 'px', '--w': t.w && t.w + 'px' }"></div>
            <div v-if="mm.cursor !== null" class="mm-cursor" :style="{ top: mm.cursor + 'px' }"></div>
          </div>
        </div>
        <div v-if="mm.preview" class="mm-preview" :class="mm.preview.me ? 'me' : 'ai'" :style="{ top: mm.preview.y + 'px' }">
          <b>{{ mm.preview.head }}</b>
          <div>{{ mm.preview.text }}</div>
        </div>
      </div>
    </div>
  </template>
