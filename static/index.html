            <template v-if="current.tokens">
              输入 {{ kilo(current.tokens.in) }} · 输出 {{ kilo(current.tokens.out) }} ·
              缓存写入 {{ kilo(current.tokens.cacheWrite) }} · 缓存命中 {{ kilo(current.tokens.cacheRead) }}
            </template>
            <template v-else>暂无记录</template>
            <template v-if="current.cost != null"> · 花费 ${{ current.cost.toFixed(2) }}</template>
          </span>
        </div>
        <div class="info-row"><b>账号限额</b>
          <span class="dim">SDK 未提供账号级用量和限额，请在终端中使用 /usage 查看</span>
        </div>
        <div class="info-row"><b>记忆文件</b>
          <span>{{ (info.data.usage.memoryFiles || []).map(f => f.path).join('、') || '无' }}</span>
        </div>
        <div class="info-row"><b>技能 / 命令占用</b>
          <span>技能 {{ info.data.usage.skills?.includedSkills }} 个 · {{ kilo(info.data.usage.skills?.tokens || 0) }}；
            命令 {{ info.data.usage.slashCommands?.includedCommands }} 个 · {{ kilo(info.data.usage.slashCommands?.tokens || 0) }}</span>
        </div>
        <div class="info-row"><b>MCP 服务</b>
          <span v-if="!info.data.mcp.length">无</span>
          <span v-else>{{ info.data.mcp.map(s => s.name + '：' + s.status).join('、') }}</span>
        </div>
      </div>
      </div>
    </section>
  </div>

  <!-- 审稿看板：整页的大卡片，能滚，开着时每 10 秒刷新（review-board.js） -->
  <div v-if="rb.open && current && !current.fresh" class="mask" @click.self="closeReview()">
    <review-board :tab="current" @close="closeReview()"></review-board>
  </div>

  <div v-if="rename.open" class="mask" @click.self="rename.open = false">
    <form class="picker small" @submit.prevent="saveRename">
      <strong>重命名会话</strong>
      <small v-if="readonly">仅修改此处显示的名称，不改动会话记录；留空则恢复原标题</small>
      <small v-else>与 CLI 中的 /rename 相同，写入会话记录，终端会话列表中也显示此名称</small>
      <input v-model="rename.name" autofocus :placeholder="rename.tab?.path">
      <p v-if="rename.error" class="error">{{ rename.error }}</p>
      <div class="picker-foot">
        <button type="button" @click="rename.open = false">取消</button>
        <button :disabled="rename.busy">{{ rename.busy ? '正在保存…' : '保存' }}</button>
      </div>
    </form>
  </div>

  <!-- 删除会话的确认：只在查看器里删，说清楚删了以后哪里看不到、哪里还看得到、怎么恢复 -->
  <div v-if="trash.open" class="mask" @click.self="trash.open = false">
    <form class="picker small" @submit.prevent="confirmDelete">
      <strong>删除「{{ trash.tab?.title || fileName(trash.tab?.path || '') }}」？</strong>
      <small>删除后，全部会话、最近会话和找话中都不再显示它，打开它的标签页（包括他人的和其他设备上的）将关闭，分享链接也将失效。
        会话文件保留，花费照常记账，终端 /resume 列表中仍可见。误删可在全部会话底部的「已删除」中恢复。</small>
      <p v-if="trash.error" class="error">{{ trash.error }}</p>
      <div class="picker-foot">
        <button type="button" @click="trash.open = false">取消</button>
        <button class="danger" :disabled="trash.busy">{{ trash.busy ? '正在删除…' : '删除' }}</button>
      </div>
    </form>
  </div>

  <!-- 编辑标签：只记在 viewer 自己的小文件里，不碰会话记录，只读模式也能改 -->
  <div v-if="tagEdit.open" class="mask" @click.self="tagEdit.open = false">
    <form class="picker small" @submit.prevent="saveTags">
      <strong>编辑标签</strong>
      <small>{{ tagEdit.title }}</small>
      <tag-picker v-model="tagEdit.tags" :options="allTags" inline></tag-picker>
      <p v-if="tagEdit.error" class="error">{{ tagEdit.error }}</p>
      <div class="picker-foot">
        <button type="button" @click="tagEdit.open = false">取消</button>
        <button :disabled="tagEdit.busy">{{ tagEdit.busy ? '正在保存…' : '保存' }}</button>
      </div>
    </form>
  </div>

  <!-- 找话：在这个会话里能精确跳到第几条，也能扫一遍全部会话 -->
  <div v-if="search.open" class="mask" @click.self="search.open = false">
    <section class="picker finder">
      <form @submit.prevent="runSearch()">
        <input :ref="el => search.input = el" v-model="search.q" @keydown.esc="search.open = false"
               placeholder="搜索内容（中文至少一个字，英文至少两个字母，区分大小写）">
        <button>搜索</button>
        <button type="button" @click="search.open = false">关闭</button>
      </form>
      <div class="crumb finder-bar">
        <label class="radio"><input type="radio" value="tab" v-model="search.scope" @change="runSearch()">当前会话</label>
        <label class="radio"><input type="radio" value="all" v-model="search.scope" @change="runSearch()">全部会话</label>
        <small v-if="search.loading">正在搜索…</small>
        <small v-else-if="search.error" class="error">{{ search.error }}</small>
        <small v-else-if="search.done && search.scope === 'tab'">
          找到 {{ search.hits.length }} 处{{ search.more ? '（仅列出前面部分）' : '' }}
        </small>
        <small v-else-if="search.done">在 {{ search.sessions.length }} 个会话中找到</small>
      </div>
      <!-- 按来源筛：点一下勾上或去掉，数字是这一类命中了几处（不受筛选影响） -->
      <div class="kind-chips">
        <button v-for="(label, k) in SEARCH_GROUPS" :key="k" type="button" class="kind-chip"
                :class="{ on: searchKinds.includes(k) }" @click="toggleKind(k)">
          {{ label }}<small v-if="search.done">{{ search.counts[k] || 0 }}</small>
        </button>
      </div>
      <ul class="entries">
        <li v-for="h in search.hits" :key="h.seq" @click="jumpTo(h)">
          <span class="label"><span class="hit">{{ h.text }}</span><small>{{ hitLabel(h) }}</small></span>
          <small>第 {{ h.seq + 1 }} 条</small>
        </li>
        <li v-for="s in search.sessions" :key="s.id" @click="openFound(s)">
          <span class="label"><spent-pts :spent="s.spent" :paid="s.spentPaid" :blue="s.spentBlue"></spent-pts>{{ s.title || fileName(s.path) }}<small>{{ s.path }}</small></span>
          <small>{{ s.hits }} 处 · {{ ago(s.mtime) }}</small>
        </li>
        <li v-if="search.done && !search.hits.length && !search.sessions.length" class="plain">未找到结果</li>
      </ul>
    </section>
  </div>

  <!-- 气泡和工具卡片的右键菜单（安卓长按、iPhone 和 iPad 双击，menu.js 的 on），内容由被点的那一条自己决定 -->
  <context-menu :api="menu"></context-menu>

  <div v-if="newChat.open" class="mask" @click.self="newChat.open = false">
    <form class="picker" @submit.prevent="createChat">
      <strong>新建会话</strong>
      <input v-model="newChat.cwd" placeholder="工作目录，比如 ~/projects/demo；不填就是家目录">
      <textarea v-model="newChat.text" rows="4" placeholder="第一句话" autofocus
                @keydown.enter.ctrl="createChat"></textarea>
      <p v-if="newChat.error" class="error">{{ newChat.error }}</p>
      <div class="picker-foot">
        <div class="foot-fields">
          <label>账号
            <!-- 新用户建在独立环境里，只列它支持的号 -->
            <ui-select v-model="newChat.account" placeholder="选一个号"
                       :options="sortedAccounts.filter(a => !me.newUser || environments.accounts.includes(a.name))
                                 .map(a => ({ value: a.name, label: acctLabel(a), disabled: a.banned || !!paidBlock(a) }))"></ui-select>
          </label>
          <div class="field">标签<tag-picker v-model="newChat.tags" :options="allTags"></tag-picker></div>
          <small>Ctrl+Enter 也能开始</small>
        </div>
        <button :disabled="newChat.busy || !newChat.text.trim()">{{ newChat.busy ? '正在启动…' : '开始' }}</button>
      </div>
    </form>
  </div>

  <div v-if="pw.open" class="mask" @click.self="pw.open = false">
    <form class="picker small" @submit.prevent="submitPassword">
      <strong>修改密码</strong>
      <small>修改后其他设备需重新登录，本设备保持登录</small>
      <input v-model="pw.old" type="password" autofocus autocomplete="current-password" placeholder="当前密码">
      <input v-model="pw.fresh" type="password" autocomplete="new-password" placeholder="新密码（至少 4 位）">
      <input v-model="pw.again" type="password" autocomplete="new-password" placeholder="确认新密码">
      <p v-if="pw.error" class="error">{{ pw.error }}</p>
      <div class="picker-foot">
        <button type="button" @click="pw.open = false">取消</button>
        <button :disabled="pw.busy || !pw.old || !pw.fresh">{{ pw.busy ? '正在保存…' : '保存' }}</button>
      </div>
    </form>
  </div>

  <!-- 预定额度：账号表表头的「预定」，或右键（手机上长按）某个号打开（reserve.js，规矩和算法见 reserve.py）。
       标题里的下拉换号，换了就重新取那个号的窗口；每个 5 小时窗口一行填订百分之几，另有周预定；每一批选先用还是当保底；
       底下列出自己在这个号上的每一批 -->
  <div v-if="rv.open" class="mask" @click.self="rv.open = false">
    <section class="picker reserve">
      <header class="info-head">
        <strong class="rv-title">预定<ui-select class="rv-acct" :model-value="rv.account" :disabled="rv.busy" placeholder="选择账号"
          @change="openReserve" :options="[...(rv.account && !accountGroups.available.some(a => a.name === rv.account) ? [rv.account] : []),
                                           ...accountGroups.available.map(a => a.name)].map(n => ({ value: n, label: n }))"></ui-select>的额度</strong>
        <small v-if="rvExpiry(quota.expires[rv.account])" class="rv-expire">{{ rvExpiry(quota.expires[rv.account]) }}</small>
        <span class="head-btns"><button @click="openReserve(rv.account)">刷新</button><button @click="rv.open = false">关闭</button></span>
      </header>
      <p v-if="rv.loading" class="empty">正在计算…</p>
      <p v-if="rv.error" class="error">{{ rv.error }}</p>
      <template v-if="rv.data">
        <p v-if="!rv.data.keeper.alive" class="error">{{ rv.data.keeper.why }}</p>
        <p v-else-if="rv.data.keeper.error" class="error">预定服务出错：{{ rv.data.keeper.error }}</p>
        <div class="rv-body">
          <!-- 号主才有（rv.data.owner，旧服务器不给就没有）：关掉后别人打开面板只看到「暂时不支持预定」，自己照常订，已有的预定不动 -->
          <label v-if="rv.data.owner && !rv.data.noReserve" class="switch rv-open"><input type="checkbox" :checked="!rv.data.closed" :disabled="rv.busy"
            @change="setReserveOpen($event.target.checked)"><i></i>接受他人预定</label>
          <!-- 号主才有（ownerPromo，旧服务器不给就没有），只对收钱的号：拖进度条定这个号收原价的百分之几，松手才存，只管以后的调用 -->
          <label v-if="rv.data.owner && rv.data.charge && rv.data.ownerPromo != null" class="rv-win rv-promo">
            <span class="rv-when">折扣</span>
            <small class="rv-max">{{ promoText(rvPromoPct()) }}</small>
            <span class="rv-input"><input type="range" min="0" max="100" step="1" :value="rvPromoPct()" :disabled="rv.busy"
              aria-label="按原价的百分比收费" @input="rv.promoDraft = +$event.target.value"
              @change="setOwnerPromo(+$event.target.value)"><b class="rv-val">{{ rvPromoPct() }}%</b></span>
          </label>
          <!-- 不开放预定的号（noReserve，只有号主打开时服务器才给）：只留上面的折扣，预定部分都不显示 -->
          <p v-if="rv.data.noReserve" class="empty">{{ rv.account }} 不开放预定，这里只能设置折扣</p>
          <template v-if="!rv.data.noReserve">
          <!-- 没有 5 小时限额的号（weekOnly）没有窗口可订，只能周预定 -->
          <div v-if="!rv.data.weekOnly" class="dd-title">5 小时窗口</div>
          <!-- 以后的窗口默认收着，只露当前窗口；收起来时填过的数照样算在这一批里，按钮上写着填了几个 -->
          <div v-if="!rv.data.weekOnly" class="rv-wins">
            <label v-for="w in rv.data.windows.filter(w => w.now || rv.future)" :key="w.start" class="rv-win" :class="{ now: w.now, bad: rvOver(w) }">
              <span class="rv-when">{{ winText(w) }}<small v-if="w.now">当前</small></span>
              <small class="rv-max">最多 {{ w.max.toFixed(1) }}%<template v-if="w.mine"> · 您已预定 {{ +w.mine.toFixed(1) }}%</template></small>
              <span class="rv-input"><input type="range" min="0" max="100" step="1" :value="rv.five[w.start] || 0"
                @input="rv.five[w.start] = $event.target.value"><b class="rv-val">{{ +(rv.five[w.start] || 0) }}%</b></span>
            </label>
            <button v-for="later in [rv.data.windows.filter(w => !w.now)]" v-show="later.length" :key="'later'" type="button"
                    class="mini rv-more" @click="rv.future = !rv.future">{{ rv.future ? '收起后续窗口'
              : `后续 ${later.length} 个窗口 ▸` }}<template v-if="!rv.future && later.some(w => +rv.five[w.start] > 0)">（已填 {{
              later.filter(w => +rv.five[w.start] > 0).length }} 个）</template></button>
          </div>
          <div class="dd-title">本周</div>
          <label class="rv-win" :class="{ bad: rvOrder.needWeek > rv.data.weekMax + 1e-6 }">
            <span class="rv-when">周预定<small>{{ winText({ start: rv.data.weekReset, end: rv.data.weekReset }).split('–')[0] }} {{ rv.data.weekExpires ? '到期' : '重置' }}</small></span>
            <small class="rv-max">最多 {{ rv.data.weekMax.toFixed(2) }}%</small>
            <span class="rv-input"><input type="range" min="0" max="100" step="0.5" :value="rv.week || 0"
              @input="rv.week = $event.target.value"><b class="rv-val">{{ +(rv.week || 0) }}%</b></span>
          </label>
          <!-- 以后的几周（服务器给的 weeks，旧服务器没有）：默认收着，收起来时填过的数照样算在这一批里 -->
          <div v-if="rv.data.weeks?.length" class="rv-wins">
            <label v-for="w in rv.data.weeks.filter(() => rv.moreWeeks)" :key="w.start" class="rv-win" :class="{ bad: rvOverWeek(w) }">
              <span class="rv-when">{{ winText(w) }}</span>
              <small class="rv-max">最多 {{ w.max.toFixed(2) }}%<template v-if="w.mine"> · 您已预定 {{ +w.mine.toFixed(2) }}%</template></small>
              <span class="rv-input"><input type="range" min="0" max="100" step="0.5" :value="rv.weeks[w.start] || 0"
                @input="rv.weeks[w.start] = $event.target.value"><b class="rv-val">{{ +(rv.weeks[w.start] || 0) }}%</b></span>
            </label>
            <button type="button" class="mini rv-more" @click="rv.moreWeeks = !rv.moreWeeks">{{ rv.moreWeeks ? '收起后续各周'
              : `后续 ${rv.data.weeks.length} 周 ▸` }}<template v-if="!rv.moreWeeks && rvOrder.weeks.length">（已填 {{ rvOrder.weeks.length }} 周）</template></button>
          </div>
          <div class="dd-title">使用顺序</div>
          <label class="rv-front"><input type="radio" :value="true" v-model="rv.front">前置<span class="rv-hint">：优先使用预定额度</span></label>
          <label class="rv-front"><input type="radio" :value="false" v-model="rv.front">后置<span class="rv-hint">：优先使用公共额度</span></label>
          <div class="dd-title">我的预定</div>
          <ul class="entries">
            <li v-for="b in rv.data.mine" :key="b.id" class="plain rv-batch">
              <span class="label"><span>{{ ago(b.ts) }} · {{ b.front ? '前置' : '后置' }} · 已付 {{ fmtPts(b.points * (rv.data.price ?? 1)) }}</span>
                <small v-for="s in b.five" :key="s.start">{{ winText({ start: s.start, end: s.start + 18000 }) }}：预定 {{ +s.pct.toFixed(1) }}%，已用 {{ s.used.toFixed(1) }}%</small>
                <small v-if="b.week">周预定 {{ +b.week.pct.toFixed(2) }}%，已用 {{ b.week.used.toFixed(2) }}%</small>
                <small v-for="x in b.weeks || []" :key="x.until">{{ winText({ start: x.start, end: x.until }) }}：预定 {{ +x.pct.toFixed(2) }}%，已用 {{ x.used.toFixed(2) }}%</small>
                <small v-if="b.cancel" class="rv-cancelled">{{ ago(b.cancel.ts) }}{{ b.cancel.by === me.name ? '由您撤销' : '由查看器账号撤销' }}，已退回 {{ fmtPts(b.cancel.refund * (rv.data.price ?? 1)) }}</small></span>
              <!-- 号主能撤自己在自己号上的单（/api/reserve/cancel） -->
              <button v-if="!b.cancel && rv.data.owner" type="button" :disabled="rv.busy" @click="cancelBatch(b)">撤销</button>
            </li>
            <li v-if="!rv.data.mine.length" class="plain">暂无</li>
          </ul>
          <!-- 这个号上别人的每一批谁都看得到（服务器给的 all 含自己的单，自己的上面已经列过，这里滤掉）；撤销按钮只给查看器账号（canCancel），没用掉的部分退钱。
               还没重启的旧服务器只给查看器账号带 all、不带 canCancel，那时有 all 就是查看器账号 -->
          <template v-if="rv.data.all">
            <div class="dd-title">同账号他人预定</div>
            <ul class="entries">
              <li v-for="b in rv.data.all.filter(b => b.user !== me.name)" :key="b.id" class="plain rv-batch">
                <span class="label"><span>{{ b.user }} · {{ ago(b.ts) }} · {{ b.front ? '前置' : '后置' }} · 已付 {{ fmtPts(b.points * (rv.data.price ?? 1)) }}</span>
                  <small v-for="s in b.five" :key="s.start">{{ winText({ start: s.start, end: s.start + 18000 }) }}：预定 {{ +s.pct.toFixed(1) }}%，已用 {{ s.used.toFixed(1) }}%</small>
                  <small v-if="b.week">周预定 {{ +b.week.pct.toFixed(2) }}%，已用 {{ b.week.used.toFixed(2) }}%</small>
                  <small v-for="x in b.weeks || []" :key="x.until">{{ winText({ start: x.start, end: x.until }) }}：预定 {{ +x.pct.toFixed(2) }}%，已用 {{ x.used.toFixed(2) }}%</small>
                  <small v-if="b.cancel" class="rv-cancelled">{{ b.cancel.by }} 于{{ ago(b.cancel.ts) }}撤销，已退回 {{ fmtPts(b.cancel.refund * (rv.data.price ?? 1)) }}</small></span>
                <button v-if="!b.cancel && rv.data.canCancel !== false" type="button" :disabled="rv.busy" @click="cancelBatch(b)">撤销</button>
              </li>
              <li v-if="!rv.data.all.some(b => b.user !== me.name)" class="plain">暂无</li>
            </ul>
          </template>
          </template>
        </div>
        <!-- 号主关了别人预定的号，查看器账号也能打开看、撤销，只是不能下新单 -->
        <p v-if="rv.data.closed && !rv.data.owner" class="error">{{ rv.account }} 暂不接受预定，仅可查看和撤销</p>
        <p v-for="p in rvOrder.problems" :key="p" class="error">{{ p }}</p>
        <!-- 价格和付款按钮固定在最底下（手机上也是），价格用大字。号主订自己的号（rv.data.owner）钱又流回自己，价格和余额都不写，按钮直接下单 -->
        <div v-if="!rv.data.noReserve" class="rv-foot">
          <div class="rv-sum">
            <small>{{ rvOrder.empty ? '' : `5 小时共 ${+rvOrder.pct5.toFixed(1)}%（${rvOrder.five.length} 个窗口）、周预定 ${+rvOrder.week.toFixed(2)}%，合计占本周 ${rvOrder.needWeek.toFixed(2)}%`
              + (rvOrder.weeks.length ? `；后续 ${rvOrder.weeks.length} 周共 ${+rvOrder.pctLater.toFixed(2)}%` : '') }}</small>
            <span v-if="!rv.data.owner" class="rv-price-line"><small>价格</small><b class="rv-price">{{ rvOrder.empty ? '–' : rvOrder.price }}</b>
              <small v-if="rv.data.charge">余额 {{ me.balance != null ? fmtPts(me.balance) : '未获取' }}</small></span>
          </div>
          <button class="rv-pay" :disabled="rv.busy || rvOrder.empty || rvOrder.problems.length > 0 || (rv.data.closed && !rv.data.owner)" @click="submitReserve">{{
            !rv.data.owner ? '付款预定' : rv.busy ? '正在预定…' : '预定' }}</button>
        </div>
      </template>
    </section>
  </div>
  <!-- 付款确认：写明买了什么、多少钱、不退，在这里点确定才真的付 -->
  <div v-if="rv.open && rv.confirm && rv.data" class="mask over" @click.self="rv.busy || (rv.confirm = false)">
    <section class="picker rv-confirm">
      <strong>确认预定 {{ rv.account }}</strong>
      <ul class="rv-confirm-list">
        <li v-for="x in rvOrder.five" :key="x.start">{{ winText({ start: x.start, end: x.start + 18000 }) }}：5 小时额度 {{ +x.pct.toFixed(1) }}%</li>
        <li v-if="rvOrder.week">本周额度 {{ +rvOrder.week.toFixed(2) }}%</li>
        <li v-for="x in rvOrder.weeks" :key="x.start">{{ winText(x) }} 当周额度 {{ +x.pct.toFixed(2) }}%</li>
        <li>使用顺序：{{ rv.front ? '前置（优先使用预定额度）' : '后置（优先使用公共额度）' }}</li>
      </ul>
      <p class="rv-confirm-price"><small>应付</small><b class="rv-price">{{ rvOrder.price }}</b><small v-if="rv.data.charge && me.balance != null">付款后余额
        {{ fmtPts(me.balance - rvOrder.points) }}</small></p>
      <!-- 号主订自己的号不弹这个窗口（reserve.js 的 submitReserve 直接下单） -->
      <p class="rv-warn">需一次付清。付款后不可撤销，未用完的额度不退款；窗口结束时（周预定为当周重置时）未用完的部分作废。</p>
      <p v-if="rv.error" class="error">{{ rv.error }}</p>
      <div class="picker-foot">
        <button type="button" :disabled="rv.busy" @click="rv.confirm = false">取消</button>
        <button type="button" class="rv-pay" :disabled="rv.busy" @click="confirmReserve">{{ rv.busy ? '正在付款…' : rv.data.charge ? `确认支付 ${rvOrder.price}` : '确认预定' }}</button>
      </div>
    </section>
  </div>

  <!-- 账本：收到的每一笔、名下会话在限量号上花了多少。点会话能打开它 -->
  <div v-if="ledger.open" class="mask over" @click.self="ledger.open = false">
    <section class="picker ledger">
      <header class="info-head">
        <strong>{{ ledger.name ? `${ledger.name} 的账本` : '我的账本' }}</strong>
        <small>单位：人民币元，仅统计限量号</small>
        <span class="head-btns"><button @click="openLedger(ledger.name)">刷新</button><button @click="ledger.open = false">关闭</button></span>
      </header>
      <p v-if="ledger.loading" class="empty">正在计算…</p>
      <p v-if="ledger.error" class="error">{{ ledger.error }}</p>
      <template v-if="ledger.data">
        <div class="info-body">
          <div class="info-row"><b>余额</b><span :class="{ neg: ledger.data.balance < 0 }">{{ fmtPts(ledger.data.balance) }}</span></div>
          <div class="info-row"><b>收到</b><span>{{ fmtPts(ledger.data.granted) }}，共 {{ ledger.data.grants.length }} 笔</span></div>
          <!-- 号主收入（users.earnings）：大家在他名下的号上花的钱，他自己用的也在内；余额看板的「收到」已经把它加进去了 -->
          <div v-if="ledger.data.earned || ledger.data.unearned" class="info-row"><b>号上收入</b><span>{{ fmtPts(ledger.data.earned) }}，为您名下账号上的全部花费（含您本人使用）<template v-if="ledger.data.unearned">；另有 {{ ledger.data.unearned }} 次调用缺少会话记录，未计入</template></span></div>
          <!-- 花掉连付预定的钱一起算（下了单钱就花掉了），收到 + 号上收入 − 花掉 = 余额，和余额看板一致 -->
          <div class="info-row"><b>支出</b><span>{{ fmtPts(ledger.data.spent + (ledger.data.reserved || 0)) }}<template v-if="ledger.data.unrated">；另有 {{ ledger.data.unrated }} 次调用的模型暂无单价，未计入</template></span></div>
          <!-- 预定额度：下单时一次付清；用预定的蓝付掉的调用不再扣钱（见 reserve.py） -->
          <div v-if="ledger.data.batches?.length" class="info-row"><b>预定</b><span>支出中 {{ fmtPts(ledger.data.reserved) }} 为预定付款，共 {{ ledger.data.batches.length }} 批；
            使用预定额度的调用合计 {{ fmtPts(ledger.data.covered) }}，未重复扣费</span></div>
        </div>
        <div class="dd-title">收到的额度</div>
        <ul class="entries">
          <li v-for="(g, i) in ledger.data.grants" :key="i" class="plain">
            <!-- 额度计划发的那几期（users.plan_grants）带着 plan、part、parts：写明第几期 -->
            <span class="label"><b :class="g.amount < 0 ? 'neg' : 'pts'">{{ g.amount > 0 ? '+' : '' }}{{ fmtPts(g.amount) }}</b><small>{{ g.plan
              ? `额度计划第 ${g.part}/${g.parts} 期${g.note ? ` · ${g.note}` : ''}` : g.note || '无备注' }}</small></span>
            <small>由 {{ g.by }} 发放 · {{ ago(g.ts) }}</small>
          </li>
          <li v-if="!ledger.data.grants.length" class="plain">暂无收到的额度</li>
        </ul>
        <div class="dd-title">会话和 API 调用在限量号上的花费</div>
        <ul class="entries">
          <li v-for="s in ledger.data.sessions" :key="s.sid" @click="s.path && openFromLedger(s)">
            <span class="label">{{ s.title || s.sid }}<small v-if="!s.path && s.source !== 'api'">会话文件不存在</small></span>
            <small><b class="pts">{{ fmtPts(s.points) }}</b><template v-if="s.unrated"> · {{ s.unrated }} 次暂无单价</template></small>
          </li>
          <li v-if="!ledger.data.sessions.length" class="plain">暂无限量号上的花费</li>
        </ul>
      </template>
    </section>
  </div>

  <!-- 花费的分项卡片（points.js 的 vSplit）：悬停或点一下某个花费时浮在它上面（太靠顶就放下面），只有一张、固定定位，不会被裁掉 -->
  <div v-if="splitPop.text" class="split-pop" :class="{ below: splitPop.top < 96 }"
       :style="{ left: `${splitPop.x}px`, top: `${splitPop.top < 96 ? splitPop.bottom + 6 : splitPop.top - 6}px` }">{{ splitPop.text }}</div>

  <!-- 价目表（账号卡片底栏的「价目表」，app.js 的 priceRows）：只列此刻能选的号用得上的模型，每百万 token 各合几元，
       和气泡上算花费的是同一份单价；一次请求按大家实际用 Opus 5.5 时的平均构成套各家单价（points.js 的 AVG_CALL） -->
  <div v-if="priceList.open" class="mask" @click.self="priceList.open = false">
    <section class="picker price-list">
      <header class="info-head">
        <strong>价目表</strong>
        <small>单价：元 / 百万 token</small>
        <span class="head-btns"><button @click="priceList.open = false">关闭</button></span>
      </header>
      <div class="price-scroll">
        <table class="price-table">
          <!-- 输入、缓存写入、缓存命中、输出各一列：没有缓存的渠道（缓存写入不收钱），输入才是大头。
               数字格写两位小数，悬停或点一下立刻弹出完整的数（style.css 的 .price-num，不用 title） -->
          <thead><tr><th>模型</th><th>输入</th><th>缓存写入</th><th>缓存命中</th><th>输出</th><th>单次调用估算</th><th>相对倍率</th></tr></thead>
          <tbody>
            <tr v-for="p in priceRows" :key="p.key">
              <td class="price-name">{{ p.name }}<acct-tag v-if="p.account" :name="p.account" :family="acctFamily(p.account)" color></acct-tag><b
                v-if="p.now" class="price-now">现在</b></td>
              <td v-for="v in [p.r.in, p.r.cw, p.r.cr, p.r.out, p.call, p.times]" class="price-num" :tabindex="v == null ? null : 0"
                  :data-full="v == null ? null : priceFull(v)">{{ v == null ? '–' : priceNum(v) }}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <p v-if="!priceRows.length" class="empty">暂无可用账号的单价</p>
      <!-- 列名不带「（元）」（太啰嗦）；两家的高峰时段各占一行 -->
      <div class="price-note">
        <small>单次调用估算按大家实际使用 Opus 5.5 时平均一次调用的用量计算：缓存写入约 7600、缓存命中约 28 万、输出约 1200 token。各家分词方式不同，同一段内容的 token 数不完全一样，仅供比较。</small>
        <small v-if="priceRows.some(p => p.fam === 'deepseek')">DeepSeek 高峰为工作日 9:00～12:00、14:00～18:00，其余时间、周末和法定节假日为空闲。</small>
        <small v-if="priceRows.some(p => p.fam === 'glm')">智谱高峰为工作日 14:00～18:00，其余时间和周末为空闲。</small>
      </div>
    </section>
  </div>

  <!-- 人设卡（见 js/personas.js、服务器 personas.py）：自己的在前、别人公开的在后，点一张展开全文和操作；
       编辑框新建、改、复制共用。样式借设备页的 -->
  <div v-if="pc.open" class="mask" @click.self="closePersonas()">
    <section class="picker devices personas">
      <header class="info-head">
        <strong>{{ pc.edit ? (pc.edit.id ? '编辑人设卡' : '新建人设卡') : '人设卡' }}</strong>
        <small>{{ pc.edit ? '' : '新建会话时可选择一张，卡上的内容将提供给 Claude' }}</small>
        <span class="head-btns">
          <button v-if="!pc.edit" type="button" :disabled="pc.loading" @click="loadPersonas()">{{ pc.loading ? '正在加载…' : '刷新' }}</button>
          <button v-else type="button" @click="pc.edit = null">返回列表</button>
          <button type="button" @click="closePersonas()">关闭</button>
        </span>
      </header>

      <form v-if="pc.edit" class="dev-body pc-form" @submit.prevent="savePersona()">
        <label>名字<input v-model="pc.edit.name" :maxlength="pc.max.name" autocomplete="off" placeholder="例如：猫娘女仆、严谨的审稿人"></label>
        <label class="pc-text">内容<textarea v-model="pc.edit.text" rows="14"
          placeholder="写给 Claude：它的身份、对您的称呼、说话口吻、做事规范等"></textarea></label>
        <small :class="{ neg: pc.edit.text.length > pc.max.text, warn: pc.edit.text.length > pc.max.softText }">{{ pc.edit.text.length }} 字。卡上的内容随每次请求发送给 Claude，内容越长花费越多{{ pc.edit.text.length > pc.max.softText ? `；已超过 ${pc.max.softText} 字，他人首次使用时将收到提醒` : '' }}。</small>
        <!-- 钩子一行一个（personas.js 的 rowsOf / hooksOf），写法同 Claude Code 的 settings.json；后端还是老的时不显示 -->
        <div v-if="hooksSupported" class="pc-hooks">
          <span>钩子（选填）</span>
          <div v-for="r in pc.edit.hooks" :key="r.key" class="pc-hook">
            <span class="pc-hook-head">
              <ui-select :model-value="r.event" @change="v => (r.event = v, textEvent(v) || (r.type = 'command'))"
                :options="Object.entries(HOOK_EVENTS).map(([value, label]) => ({ value, label }))"></ui-select>
              <ui-select :model-value="r.type" @change="v => (r.type = v)"
                :options="[{ value: 'text', label: '附文字', disabled: !textEvent(r.event) }, { value: 'command', label: '执行命令' }]"></ui-select>
              <input v-model="r.matcher" placeholder="匹配（留空表示全部）" autocomplete="off">
              <button type="button" class="mini" @click="dropHookRow(r)">删除</button>
            </span>
            <template v-if="r.type === 'text'">
              <textarea v-model="r.text" rows="3" placeholder="每次附加给 Claude 的文字；「{随机}」处替换为下方随机抽取的一句"></textarea>
              <textarea v-model="r.choices" rows="2" placeholder="随机句子（选填），每行一句，每次抽取一句"></textarea>
              <small :class="{ warn: hookHeavy(r), neg: hookSize(r) > pc.max.hookText }">每次附加 {{ hookSize(r) }} 字{{ hookHeavy(r) ? `，已超过该时机的提醒线 ${pc.max.textEvents[r.event]} 字，他人首次使用时将收到提醒` : '' }}。</small>
            </template>
            <template v-else>
              <input v-model="r.command" placeholder='命令，例如 bash "$CC_PERSONA_DIR/scripts/提醒.sh" prompt' autocomplete="off" spellcheck="false">
              <label class="pc-timeout">超时<input v-model="r.timeout" type="number" min="1" :max="pc.max.timeout" placeholder="60"> 秒</label>
            </template>
          </div>
          <span><button type="button" class="mini" :disabled="pc.edit.hooks.length >= pc.max.hooks" @click="addHookRow()">＋ 添加钩子</button></span>
          <small>时机、匹配和命令的写法与 Claude Code 的 settings.json 相同，仅对使用此卡的会话生效。命令中用 $CC_PERSONA_DIR/scripts/脚本名 引用下方附带的脚本。
            带命令或脚本的卡，他人首次使用前需查看并同意。</small>
        </div>
        <div v-if="hooksSupported" class="pc-files">
          <span>脚本（选填）</span>
          <ul v-if="pc.edit.scripts.length">
            <li v-for="s in pc.edit.scripts" :key="s.name"><span class="pc-file-name">{{ s.name }}</span>
              <small>{{ s.text.length }} 字</small><button type="button" class="mini" @click="dropPersonaScript(s.name)">移除</button></li>
          </ul>
          <span v-if="pc.edit.scripts.length < pc.max.scripts"><button type="button" class="mini"
            @click="$event.currentTarget.nextElementSibling.click()">选择脚本文件…</button><input type="file" multiple hidden
            @change="addPersonaScripts"></span>
          <small>最多 {{ pc.max.scripts }} 个，每个不超过 {{ pc.max.script }} 字，同名文件将被替换。</small>
        </div>
        <div class="pc-files">
          <span>补充资料（选填）</span>
          <ul v-if="pc.edit.files.length">
            <li v-for="f in pc.edit.files" :key="f.name"><span class="pc-file-name">{{ f.name }}</span>
              <small>{{ f.size }} 字</small><button type="button" class="mini" @click="dropPersonaFile(f.name)">移除</button></li>
          </ul>
          <span><button type="button" class="mini"
            @click="$event.currentTarget.nextElementSibling.click()">选择文本文件…</button><input type="file" multiple hidden
            @change="addPersonaFiles"></span>
          <small>同名文件将被替换。新建会话时写入磁盘，Claude 仅在需要时读取，不会随每次请求发送。</small>
        </div>
        <label class="pc-check"><input v-model="pc.edit.public" type="checkbox"> 公开给所有人（他人仅可选用，不可修改）</label>
        <p v-if="pc.edit.error" class="error">{{ pc.edit.error }}</p>
        <span class="dev-form-btns"><button class="dev-add" :disabled="!!pc.busy">{{ pc.busy === 'save' ? '正在保存…' : '保存' }}</button>
          <button type="button" @click="pc.edit = null">取消</button></span>
        <small v-if="pc.edit.id">修改仅对之后新建的会话生效，已有会话不受影响。</small>
      </form>

      <div v-else class="dev-body">
        <p v-if="pc.error" class="error">{{ pc.error }}</p>
        <p v-if="pc.defaultGone" class="error">您设为默认的「{{ pc.defaultGone }}」已被删除或撤回公开，新建会话将默认不使用人设卡。</p>
        <p v-if="!me.name" class="dev-note">登录后可创建自己的人设卡；当前可在新建会话时选用公开的人设卡。</p>
        <ul class="dev-list">
          <li v-for="c in pc.cards" :key="c.id" class="dev-row" :class="{ open: pc.expanded === c.id }">
            <div class="dev-line" @click="togglePersona(c)">
              <span class="dev-main">
                <span class="dev-name"><b>{{ c.name }}</b><span v-if="c.id === pc.default" class="pc-default">默认人设卡</span></span>
                <small>{{ ownerText(c) }} · {{ c.text.length }} 字{{ hookCount(c) ? ` · ${hookCount(c)} 个钩子` : '' }}{{ (c.scripts || []).length ? ` · ${c.scripts.length} 个脚本` : '' }}{{ (c.files || []).length ? ` · ${c.files.length} 份补充资料` : '' }}</small>
              </span>
              <span class="dev-caret">{{ pc.expanded === c.id ? '收起' : c.mine ? '管理' : '查看' }}</span>
            </div>
            <div v-if="pc.expanded === c.id" class="dev-detail pc-detail">
              <div class="dev-acts">
                <template v-if="c.mine">
                  <button type="button" :disabled="!!pc.busy" @click="startPersona(c)">{{ pc.busy === 'open:' + c.id ? '正在加载…' : '编辑' }}</button>
                  <button type="button" :disabled="!!pc.busy" @click="publishPersona(c, !c.public)">{{ c.public ? '撤回公开' : '公开' }}</button>
                </template>
                <button v-else-if="me.admin && c.public" type="button" :disabled="!!pc.busy" @click="publishPersona(c, false)">撤回公开</button>
                <button v-if="me.name" type="button" :disabled="!!pc.busy" @click="defaultPersona(c, c.id !== pc.default)">{{ c.id === pc.default ? '取消默认' : '设为默认' }}</button>
                <button v-if="me.name && !c.mine" type="button" :disabled="!!pc.busy" @click="startPersona(c, true)">{{ pc.busy === 'open:' + c.id ? '正在加载…' : '复制为我的' }}</button>
                <button v-if="c.mine" type="button" class="danger" @click="pc.confirm = c.id">删除…</button>
              </div>
              <p v-if="pc.msg[c.id]" :class="pc.msg[c.id].ok ? 'dev-ok' : 'error'">{{ pc.msg[c.id].text }}</p>
              <div v-if="pc.confirm === c.id" class="dev-confirm">
                <p>删除「{{ c.name }}」后，新建会话时将无法再选择它{{ c.public ? '，他人也无法选择' : '' }}；已使用它创建的会话不受影响。</p>
                <span class="dev-form-btns"><button type="button" class="danger" :disabled="!!pc.busy" @click="deletePersona(c)">{{ pc.busy === 'del:' + c.id ? '正在删除…' : '确定删除' }}</button>
                  <button type="button" @click="pc.confirm = ''">取消</button></span>
              </div>
              <pre class="pc-preview">{{ c.text || '（内容为空）' }}</pre>
              <template v-if="hookCount(c)"><small class="pc-sub">钩子</small><pre class="pc-preview">{{ hookLines(c).join('\n') }}</pre></template>
              <small v-if="(c.scripts || []).length" class="pc-sub">脚本：{{ c.scripts.map(s => `${s.name}（${s.size} 字）`).join('、') }}</small>
              <small v-if="(c.files || []).length" class="pc-sub">补充资料：{{ c.files.map(f => `${f.name}（${f.size} 字）`).join('、') }}</small>
              <small v-for="w in c.heavy || []" :key="w" class="pc-sub warn">占用上下文较多：{{ w }}</small>
            </div>
          </li>
          <li v-if="!pc.loading && !pc.error && !pc.cards.length" class="dev-empty">
            暂无人设卡。创建后写明 Claude 的身份和说话方式，新建会话时选择即可。</li>
        </ul>
        <div v-if="me.name" class="dev-foot"><button type="button" class="dev-add" @click="startPersona()">＋ 新建人设卡</button></div>
      </div>
    </section>
  </div>

  <!-- 第一次用一张要先问的人设卡（personas.js 的 confirmPersona）：带命令、脚本的列出全部钩子和脚本全文，很长的写明每次多带多少字 -->
  <div v-if="pc.ask" class="mask" @click.self="answerAsk(false)">
    <section class="picker devices personas pc-ask">
      <header class="info-head"><strong>使用人设卡「{{ pc.ask.card.name }}」前请确认</strong><small>作者：{{ pc.ask.card.owner }}</small></header>
      <div class="dev-body">
        <template v-if="pc.ask.card.runsCode">
          <p>此卡包含命令或脚本，将在您的会话中自动执行，权限与会话中的 Claude 相同（可读写文件、联网）。请先查看：</p>
          <pre class="pc-preview">{{ hookLines(pc.ask.card).join('\n') }}</pre>
          <template v-for="s in pc.ask.card.scripts" :key="s.name">
            <small class="pc-sub">脚本 {{ s.name }}</small><pre class="pc-preview">{{ s.text }}</pre>
          </template>
        </template>
        <template v-if="(pc.ask.card.heavy || []).length">
          <p>此卡占用上下文较多，每次请求都会额外附带以下内容，花费相应增加：</p>
          <ul><li v-for="w in pc.ask.card.heavy" :key="w">{{ w }}</li></ul>
        </template>
        <p class="dev-note">同意后，使用此版本时不再询问；作者修改{{ pc.ask.card.runsCode ? '命令、脚本' : '' }}或内容变长时将再次询问。</p>
        <span class="dev-form-btns"><button type="button" class="dev-add" @click="answerAsk(true)">同意并使用</button>
          <button type="button" @click="answerAsk(false)">取消</button></span>
      </div>
    </section>
  </div>

  <!-- 设备（见 js/devices.js、服务器 devices.py）：自己的电脑和服务器。列表里点一台展开操作和执行记录；
       「添加设备」分电脑（运行一行命令，实时看进度）和服务器（加公钥、填地址）两种 -->
  <div v-if="dev.open" class="mask" @click.self="closeDevices()">
    <section class="picker devices">
      <header class="info-head">
        <strong>{{ devTitle }}</strong>
        <small>{{ dev.view === 'list' ? '在对话中按名称指代设备，例如「查看 win 桌面上的文件」' : '' }}</small>
        <span class="head-btns">
          <button v-if="dev.view === 'list'" type="button" :disabled="dev.loading" @click="loadDevices()">{{ dev.loading ? '正在加载…' : '刷新' }}</button>
          <button v-else type="button" @click="devBack()">返回列表</button>
          <button type="button" @click="closeDevices()">关闭</button>
        </span>
      </header>

      <!-- 列表 -->
      <div v-if="dev.view === 'list'" class="dev-body">
        <p v-if="dev.error" class="error">{{ dev.error }}</p>
        <div v-if="dev.removal" class="dev-removal">
          <b>删除「{{ dev.removal.name }}」</b>
          <p v-for="(s, i) in dev.removal.steps" :key="i" :class="s.ok ? 'dev-ok' : 'error'">{{ s.ok ? '✓' : '✗' }} {{ s.text }}</p>
          <template v-if="dev.removal.kind === 'pc' && dev.removal.steps.some(s => !s.ok)">
            <p>如需卸载该电脑上的组件，请在该电脑上运行以下命令（Windows 需以管理员身份打开 PowerShell）：</p>
            <div class="dev-cmd"><code>{{ dev.removal.os === 'windows' ? UNINSTALL.windows : UNINSTALL.unix }}</code>
              <button type="button" @click="copyUninstall(dev.removal.os === 'windows' ? 'windows' : 'unix')">复制</button></div>
          </template>
          <button type="button" class="mini" @click="dev.removal = null">确定</button>
        </div>
        <ul class="dev-list">
          <li v-for="p in dev.pending" :key="p.tok" class="dev-row pending" @click="openLink(p.tok)">
            <div class="dev-line">
              <span class="dev-icon" :class="pendingIcon(p)">
                <svg v-if="p.error" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.8v3.6M8 11h.01"/></svg>
                <svg v-else-if="p.stuck" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.4 1.6"/></svg>
                <svg v-else viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 1-6 6"/></svg>
              </span>
              <span class="dev-main"><b>正在添加电脑</b><small :class="{ neg: p.error }">{{ pendingText(p) }}</small></span>
              <button type="button" class="mini">查看进度</button>
            </div>
          </li>
          <li v-for="d in dev.devices" :key="d.name" class="dev-row" :class="{ open: dev.expanded === d.name }">
            <div class="dev-line" @click="toggleDev(d)">
              <span class="dev-icon" :class="devState(d).cls">
                <svg v-if="d.kind === 'pc'" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="8" rx="1"/><path d="M6 14h4M8 11v3"/></svg>
                <svg v-else viewBox="0 0 16 16"><rect x="3" y="2" width="10" height="5" rx="1"/><rect x="3" y="9" width="10" height="5" rx="1"/>
                  <path d="M5.5 4.5h.01M5.5 11.5h.01"/></svg>
              </span>
              <span class="dev-main">
                <span class="dev-name"><b>{{ d.name }}</b><span class="dev-state" :class="devState(d).cls">{{ devState(d).text }}</span></span>
                <small>{{ devDesc(d) }}<template v-if="d.note"> · {{ d.note }}</template></small>
                <small v-if="d.last" class="dev-last">{{ lastText(d) }}</small>
              </span>
              <span class="dev-caret">{{ dev.expanded === d.name ? '收起' : '管理' }}</span>
            </div>
            <div v-if="dev.expanded === d.name" class="dev-detail">
              <div class="dev-acts">
                <button type="button" :disabled="!!dev.busy || d.paused" @click="testDev(d)">{{ dev.busy === 'test:' + d.name ? '正在连接…' : '测试连接' }}</button>
                <button type="button" :disabled="!!dev.busy"                        @click="pauseDev(d, !d.paused)">{{ d.paused ? '恢复访问' : '暂停访问' }}</button>
                <button type="button" @click="startEdit(d)">修改名称和备注</button>
                <!-- 新用户在独立环境里：AI 读不到添加电脑的进度记录（在共用环境那边），不给这个入口 -->
                <button v-if="!me.newUser" type="button" @click="askClaudeDev(d)">请 Claude 排查</button>
                <button type="button" class="danger" @click="askDelete(d)">删除…</button>
              </div>
              <p v-if="dev.msg[d.name]" :class="dev.msg[d.name].ok ? 'dev-ok' : 'error'">{{ dev.msg[d.name].text }}</p>
              <form v-if="dev.edit.name === d.name" class="dev-form" @submit.prevent="saveEdit(d)">
                <label>名字<input v-model="dev.edit.to" maxlength="32" autocomplete="off" spellcheck="false"></label>
                <label>备注<input v-model="dev.edit.note" maxlength="200" placeholder="例如：实验室台式机"></label>
                <span class="dev-form-btns"><button :disabled="!!dev.busy">保存</button><button type="button" @click="dev.edit.name = ''">取消</button></span>
                <small>Claude 在对话中按名称识别设备，改名后请使用新名称。名称仅可包含字母、数字、点、连字符和下划线。</small>
              </form>
              <div v-if="dev.confirm === d.name" class="dev-confirm">
                <p>删除「{{ d.name }}」后，Claude 将无法再连接该设备。</p>
                <label v-if="d.kind === 'pc'"><input v-model="dev.cleanup" type="checkbox">
                  同时卸载该电脑上的连接程序和密钥{{ d.online ? '' : '（电脑当前离线，无法卸载，请稍后自行卸载）' }}；不影响 SSH 服务本身</label>
                <label v-else><input v-model="dev.cleanup" type="checkbox"> 同时从服务器上删除门卫公钥（适用于 Linux、Mac 服务器）。
                  与其共用家目录的服务器（实验室服务器常见此情况）以及以其他地址登记的同一台服务器也将无法连接；如不确定，请勿勾选</label>
                <span class="dev-form-btns"><button type="button" class="danger" :disabled="!!dev.busy" @click="doDelete(d)">{{ dev.busy === 'del:' + d.name ? '正在删除…' : '确定删除' }}</button>
                  <button type="button" @click="dev.confirm = ''">取消</button></span>
              </div>
              <div class="info-body dev-info">
                <div class="info-row"><b>{{ d.kind === 'pc' ? '连接方式' : '地址' }}</b><span>{{ d.kind === 'pc'
                  ? `经中转服务器连到${$who.host}（端口 ${d.port}）` : `${d.host}，端口 ${d.port}${d.via ? `，经 ${d.via} 跳转` : ''}` }}</span></div>
                <div class="info-row"><b>登录用户</b><span>{{ d.login }}</span></div>
                <div v-if="d.ts" class="info-row"><b>添加时间</b><span>{{ ago(d.ts) }}{{ addedText(d) }}</span></div>
              </div>
              <div class="dd-title">最近在这台设备上执行的命令<small>门卫记录每一次连接</small></div>
              <ul class="dev-hist">
                <li v-for="(h, i) in dev.hist[d.name] || []" :key="i"><code>{{ h.cmd }}</code>
                  <small>{{ histWho(h) }} · {{ ago(h.ts) }}<template v-if="h.exit !== 0"> · 退出码 {{ h.exit }}</template></small></li>
                <li v-if="dev.hist[d.name] && !dev.hist[d.name].length" class="plain">暂无记录</li>
              </ul>
            </div>
          </li>
          <li v-if="!dev.loading && !dev.error && !dev.devices.length && !dev.pending.length" class="dev-empty">
            暂无设备。添加后即可在对话中让 Claude 操作该设备，例如「查看我电脑桌面上的文件」。</li>
        </ul>
        <div class="dev-foot"><button type="button" class="dev-add" @click="dev.view = 'choose'">＋ 添加设备<i v-if="devDot" class="rdot"></i></button></div>
      </div>

      <!-- 选添加哪一种 -->
      <div v-else-if="dev.view === 'choose'" class="dev-body dev-choose">
        <button type="button" class="dev-kind" @click="addPc()">
          <svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="8" rx="1"/><path d="M6 14h4M8 11v3"/></svg>
          <b>我的电脑</b><small>Windows、Mac 或 Linux。在该电脑上运行一行命令，此后开机自动连接，Claude 可在其上处理文件、运行程序。</small></button>
        <button type="button" class="dev-kind" @click="addServer()">
          <svg viewBox="0 0 16 16"><rect x="3" y="2" width="10" height="5" rx="1"/><rect x="3" y="9" width="10" height="5" rx="1"/></svg>
          <b>服务器</b><small>已可通过 SSH 登录的服务器，例如实验室服务器或云服务器。将一行公钥添加到服务器后填写地址。</small></button>
      </div>

      <!-- 添加电脑：命令、怎么运行、实时进度 -->
      <div v-else-if="dev.view === 'pc'" class="dev-body">
        <p v-if="dev.linkError" class="error">{{ dev.linkError }}</p>
        <p v-if="!dev.link && !dev.linkError" class="empty">正在生成安装命令…</p>
        <template v-if="dev.link">
          <template v-if="!linkOk">
            <div class="dev-seg" role="tablist">
              <button v-for="(label, os) in OS_LABEL" :key="os" type="button" :class="{ on: dev.os === os }" @click="dev.os = os">{{ label }}</button>
            </div>
            <ol class="dev-howto"><li v-for="(t, i) in HOWTO[dev.os]" :key="i">{{ t }}</li></ol>
            <div class="dev-cmd"><code>{{ linkCmd }}</code><button type="button" @click="copyCmd()">复制</button></div>
            <small class="dev-left">{{ linkLeft > 0 ? `此命令 ${linkLeft} 分钟内有效；安装失败可再次运行，其他电脑也可使用此命令安装` : '此命令已过期，请点击「返回列表」重新添加' }}</small>
          </template>
          <div class="dd-title">进度<small>{{ dev.link.downloaded ? '' : '等待您在电脑上运行命令' }}</small></div>
          <ol class="dev-steps">
            <li v-for="(s, i) in linkSteps" :key="i" :class="s.state"><span class="dev-step-dot"></span>{{ s.name }}<small v-if="s.note">{{ s.note }}</small></li>
          </ol>
          <div v-if="linkOk" class="dev-result ok">
            <b>已连接</b>
            <p>{{ OS_LABEL[linkOk.os] ? OS_LABEL[linkOk.os] + ' ' : '' }}电脑 {{ linkOk.host }}（用户 {{ linkOk.user }}）在设备列表中的名称为「{{ linkOk.name }}」。
              现在可以在对话中让 Claude 操作它，例如「查看 {{ linkOk.name }} 桌面上的文件」。</p>
            <button type="button" @click="devBack()">前往设备列表</button>
          </div>
          <div v-else-if="dev.link.error || linkBad" class="dev-result bad">
            <b>{{ dev.link.error ? '安装出错' : '已连接，但登录失败' }}</b>
            <p v-if="dev.link.tip">{{ dev.link.tip }}</p>
            <p class="dev-raw">{{ dev.link.error || linkBad.why }}</p>
            <p>{{ linkLeft > 0 ? '处理完成后，请在电脑上再次运行同一命令。' : '处理完成后，请返回列表重新添加（此命令已过期）。' }}</p>
            <button v-if="!me.newUser" type="button" @click="askLink()">请 Claude 排查</button>
          </div>
          <div v-else-if="dev.link.stuck" class="dev-result wait">
            <b>已 {{ Math.round(dev.link.stuck / 60) }} 分钟无进展</b>
            <p>{{ dev.link.elevate ? '请确认是否已在弹出的窗口中点击「是」，该窗口可能被其他窗口遮挡。' : '请查看电脑上的窗口停在哪一行、是否有提示。' }}</p>
            <button v-if="!me.newUser" type="button" @click="askLink()">请 Claude 排查</button>
          </div>
          <details v-if="dev.link.events.length" class="dev-log">
            <summary>详细过程（{{ dev.link.events.length }} 条）</summary>
            <ul><li v-for="(e, i) in dev.link.events" :key="i"><small>{{ clock(e.ts * 1000) }}</small> {{ e.text }}</li></ul>
          </details>
        </template>
      </div>

      <!-- 添加服务器：先把公钥加到服务器上，再填地址试连 -->
      <form v-else-if="dev.view === 'server'" class="dev-body dev-server" @submit.prevent="saveServer()">
        <div class="dd-title">第一步：将门卫公钥添加到服务器</div>
        <p class="dev-note">请按平时的方式登录该服务器，粘贴并运行下面这行命令。它仅将一行公钥加入 ~/.ssh/authorized_keys，
          此后 Claude 可以您的账号登录该服务器；这把钥匙仅限您本人的会话使用。</p>
        <div class="dev-cmd"><code>{{ keyCmd }}</code><button type="button" @click="copyKeyCmd()">复制</button></div>
        <div class="dd-title">第二步：填写地址</div>
        <div class="dev-grid">
          <label>名字<input v-model="dev.server.name" maxlength="32" placeholder="例如 lab" autocomplete="off" spellcheck="false"></label>
          <label>登录用户名<input v-model="dev.server.login" placeholder="您在服务器上的用户名" autocomplete="off" spellcheck="false"></label>
          <label>地址<input v-model="dev.server.host" placeholder="域名或 IP" autocomplete="off" spellcheck="false"></label>
          <label>端口<input v-model.number="dev.server.port" type="number" min="1" max="65535"></label>
          <label>经过（选填）<ui-select v-model="dev.server.via" :options="[{ value: '', label: '直接连接' },
            ...dev.devices.map(d => ({ value: d.name, label: `经 ${d.name} 跳转` }))]"></ui-select></label>
        </div>
        <p v-if="dev.server.error" class="error">{{ dev.server.error }}</p>
        <div v-if="dev.server.result" class="dev-result" :class="dev.server.result.ok ? 'ok' : 'bad'">
          <b>{{ dev.server.result.ok ? '已连接' : '已登记，但暂时无法连接' }}</b>
          <p class="dev-raw">{{ dev.server.result.text }}</p>
          <p v-if="!dev.server.result.ok">通常是第一步的公钥尚未添加，或地址、用户名有误。修正后请在设备列表中点击该设备的「测试连接」。</p>
        </div>
        <div class="dev-foot">
          <button v-if="dev.server.result" type="button" @click="devBack()">前往设备列表</button>
          <button v-else class="dev-add" :disabled="dev.server.busy">{{ dev.server.busy ? '正在登记并测试连接…' : '登记并测试连接' }}</button>
        </div>
      </form>
    </section>
  </div>

  <!-- 余额看板：谁都能看，查看器账号不列，默认按余额从多到少，也能和用户管理一样按注册先后、最近用量排；
       最近用量按实际用掉的写（蓝的是预定付掉的调用，和会话那边一样，不给 bought）；透支到上限的标出来（限量号已经用不了） -->
  <div v-if="board.open" class="mask" @click.self="board.open = false">
    <section class="picker admin">
      <header class="info-head">
        <strong>余额看板</strong>
        <small>单位：人民币元<template v-if="board.overdraft != null">；余额降至 {{ fmtPts(board.overdraft) }} 时将无法使用限量号</template></small>
        <span class="head-btns"><button @click="openBoard()">刷新</button><button @click="board.open = false">关闭</button></span>
      </header>
      <div class="ov-ctrl admin-ctrl">
        <label>最近<input v-model.number="ovView.mins" type="number" min="1" max="43200" list="recent-mins" @change="openBoard()">分钟的用量</label>
        <label>排序<ui-select v-model="ovView.boardSort" :options="[{ value: 'balance', label: '余额' },
          { value: 'join', label: '注册先后' }, { value: 'recent', label: '最近用量' }]"></ui-select></label>
      </div>
      <p v-if="board.loading" class="empty">正在加载…</p>
      <ul class="entries">
        <li v-for="(u, i) in boardUsers" :key="u.name" :class="{ on: u.name === me.name }">
          <span class="label">{{ i + 1 }}. {{ u.name }}<b v-if="u.blocked" class="paid-mark">透支停用</b>
            <small>收到 {{ fmtPts(u.granted) }} · 支出 {{ fmtPts(u.spent) }}<template v-if="u.ts"> · {{ ago(u.ts) }}注册</template></small>
            <small v-if="board.recentOf" class="recent-pts">最近 {{ board.recentOf }} 分钟
              <spent-pts v-if="spentText(u.recent?.all)" :spent="u.recent.all" :paid="u.recent.paid" :blue="u.recent.blue"></spent-pts><template
                v-else>无用量</template></small></span>
          <small>余额 <b :class="u.balance < 0 ? 'neg' : 'pts'">{{ fmtPts(u.balance) }}</b></small>
        </li>
        <li v-if="!board.loading && !board.users.length" class="plain">暂无用户</li>
      </ul>
      <p v-if="board.error" class="error">{{ board.error }}</p>
    </section>
  </div>

  <!-- 用量统计（stats.js、后端 stats.usage）：账号页「用量」点进来。顶上选时间范围和看谁（我、所有人，
       查看器账号还能挑某个人），下面一块块：几个总数、每小时的用量曲线（能换花费、请求次数、三种 token）、一天里什么时候用、
       典型的一次请求、三种 token 的分布、输入里缓存占多少、按模型、按号、会话、每个人（只给查看器账号）。
       看自己或某个人时都和「其他人」「所有人」对照着画：自己主题色，别人灰色 -->
  <div v-if="us.open" class="mask" @click.self="us.open = false">
    <section class="picker admin usage">
      <header class="info-head">
        <strong>用量统计</strong>
        <small>花费按单价折成人民币元；实际扣费是余额里扣掉的那部分</small>
        <span class="head-btns"><button @click="refreshUsage()">刷新</button><button @click="us.open = false">关闭</button></span>
      </header>
      <div class="us-ctrl">
        <span class="us-chips"><button v-for="r in RANGES" :key="r.value" type="button" :class="{ on: us.days === r.value }"
          @click="us.days = r.value">{{ r.label }}</button></span>
        <ui-select v-if="me.admin && uv && uv.whoOptions.length > 2" v-model="us.who" :options="uv.whoOptions" aria-label="看谁的用量"></ui-select>
        <span v-else class="us-chips"><button type="button" :class="{ on: !us.who }" @click="us.who = ''">我</button><button type="button"
          :class="{ on: us.who === 'all' }" @click="us.who = 'all'">所有人</button></span>
        <small v-if="us.loading && uv" class="us-busy">正在统计…</small>
      </div>
      <p v-if="us.error" class="error">{{ us.error }}</p>
      <p v-if="!uv" class="empty">{{ us.loading ? '正在统计…' : '' }}</p>
      <div v-else class="us-body" :class="{ busy: us.loading }">
        <div class="us-kpis"><div v-for="k in uv.kpis" :key="k.k" class="us-kpi"><small>{{ k.k }}</small><b>{{ k.v }}</b></div></div>
        <section class="us-sec">
          <header><b>用量曲线</b><span class="us-chips"><button v-for="m in METRICS" :key="m.value" type="button"
            :class="{ on: us.metric === m.value }" @click="us.metric = m.value">{{ m.label }}</button></span></header>
          <line-chart :series="uv.line" :t0="us.data.t0" :step="us.data.step" :fmt="uv.lineFmt" :height="160"
                      :idle="`每小时的${METRICS.find(m => m.value === us.metric).label}`"></line-chart>
        </section>
        <section class="us-sec">
          <header><b>一天里什么时候用</b><small>每个钟点占这段时间花费的百分之几</small></header>
          <bar-chart :labels="uv.clock.labels" :series="uv.clock.series" :fmt="v => v.toFixed(1) + '%'" :every="6" :height="80"></bar-chart>
        </section>
        <section class="us-sec">
          <header><b>典型的一次请求</b><small>中位数，括号里是中间一半请求的范围</small></header>
          <div class="us-typ">
            <div class="us-typ-row us-typ-head"><span></span><span><i class="lc-key me"></i>{{ uv.meLabel }}</span><span
              v-if="uv.othLabel"><i class="lc-key pool"></i>{{ uv.othLabel }}</span></div>
            <div v-for="t in uv.typ" :key="t.k" class="us-typ-row"><span>{{ t.label }}</span>
              <span class="us-tb"><i class="me" :style="{ width: t.wa + '%' }"></i><b>{{ tokText(t.a?.[1]) }}</b><small
                v-if="t.a">{{ tokText(t.a[0]) }}–{{ tokText(t.a[2]) }}</small></span>
              <span v-if="uv.othLabel" class="us-tb"><i class="pool" :style="{ width: t.wb + '%' }"></i><b>{{ tokText(t.b?.[1]) }}</b><small
                v-if="t.b">{{ tokText(t.b[0]) }}–{{ tokText(t.b[2]) }}</small></span></div>
          </div>
        </section>
        <section class="us-sec">
          <header><b>三种 token 的分布</b><span class="us-chips"><button v-for="k in ['cw', 'cr', 'out']" :key="k" type="button"
            :class="{ on: us.tok === k }" @click="us.tok = k">{{ TOK_LABEL[k] }}</button></span></header>
          <bar-chart :labels="uv.hist.labels" :series="uv.hist.series" :fmt="v => v.toFixed(1) + '% 的请求'" :every="uv.hist.every" :height="90"
                     idle="一次请求里有多少，各档占请求的百分之几"></bar-chart>
        </section>
        <section v-if="uv.mix.length" class="us-sec">
          <header><b>输入里的缓存</b><small>这段时间的输入 token 各占多少；输出共 {{ tokText(uv.out) }}</small></header>
          <div class="us-mix"><i v-for="m in uv.mix" :key="m.k" :class="'mix-' + m.k" :style="{ width: m.w + '%' }"></i></div>
          <div class="us-mix-key"><span v-for="m in uv.mix" :key="m.k"><i class="lc-key" :class="'mix-' + m.k"></i>{{ m.label }} {{ m.w.toFixed(1) }}%</span></div>
        </section>
        <div class="us-two">
          <section class="us-sec">
            <header><b>按模型</b></header>
            <div v-for="m in uv.models" :key="m.model" class="us-hrow"><span>{{ m.label }}</span><i><i :style="{ width: m.w + '%' }"></i></i><b>{{ money(m.full) }}</b><small>{{ m.n }} 次</small></div>
            <p v-if="!uv.models.length" class="us-none">这段时间没有请求</p>
          </section>
          <section class="us-sec">
            <header><b>按号</b></header>
            <div v-for="a in uv.accounts" :key="a.account" class="us-hrow"><span>{{ a.account === '?' ? '未记录' : a.account }}</span><i><i
              :style="{ width: a.w + '%' }"></i></i><b>{{ money(a.full) }}</b><small>{{ a.n }} 次</small></div>
            <p v-if="!uv.accounts.length" class="us-none">这段时间没有请求</p>
          </section>
        </div>
        <section class="us-sec">
          <header><b>会话</b><small>{{ uv.sess.count }} 个会话<template v-if="uv.sess.count">，每个会话请求 {{ uv.sess.callsPer[1] }} 次、花 {{ money(uv.sess.costPer[1]) }}（中位）</template><template
            v-if="!uv.all && uv.othSess.count">；其他人的会话 {{ uv.othSess.callsPer[1] }} 次、{{ money(uv.othSess.costPer[1]) }}</template></small></header>
          <div v-for="s in uv.sess.top || []" :key="s.sid" class="us-hrow us-sess"><span>{{ s.title || '未命名会话' }}</span><b>{{ money(s.full) }}</b><small>{{ s.n }} 次 · {{ ago(s.last) }}</small></div>
        </section>
        <section v-if="uv.users.length" class="us-sec">
          <header><b>每个人</b><small>只有查看器账号看得到，点名字看这个人的统计</small></header>
          <button v-for="u in uv.users" :key="u.name || '-'" type="button" class="us-hrow" :class="{ on: u.name === us.data.who }"
                  @click="u.name && (us.who = u.name === me.name ? '' : u.name)"><span>{{ u.name || '无主会话' }}</span><i><i
                  :style="{ width: u.w + '%' }"></i></i><b>{{ money(u.full) }}</b><small>{{ u.n }} 次</small></button>
        </section>
      </div>
    </section>
  </div>

  <!-- 「最近多少分钟」输入框的快捷选项，全部会话和用户管理共用 -->
  <datalist id="recent-mins"><option value="10"></option><option value="60"></option><option value="300"></option></datalist>

  <!-- 用户管理（查看器账号）：名单一人一行，点进去是这个人的页面（admin.sel）：余额和收支、发放额度（按月计划或一次发放）、
       额度计划（能撤销）、重设密码和运行环境。以前名单下面摊着两张带用户下拉的表单，又丑又占地方 -->
  <div v-if="admin.open" class="mask" @click.self="admin.open = false">
    <section class="picker admin users-admin">
      <template v-if="!adminUser">
        <header class="info-head">
          <strong>用户管理</strong>
          <small>{{ admin.users.length ? `${admin.users.length} 位用户 · ` : '' }}单位：人民币元</small>
          <span class="head-btns"><button @click="openAdmin()">刷新</button><button @click="admin.open = false">关闭</button></span>
        </header>
        <!-- 最近 N 分钟的用量：免费、限量分两种颜色写；按用量排时按两者的和 -->
        <div class="ov-ctrl admin-ctrl">
          <label>最近<input v-model.number="ovView.mins" type="number" min="1" max="43200" list="recent-mins" @change="openAdmin()">分钟的用量</label>
          <label>排序<ui-select v-model="ovView.adminSort"
            :options="[{ value: 'join', label: '注册先后' }, { value: 'recent', label: '最近用量' }]"></ui-select></label>
        </div>
        <p v-if="admin.loading" class="empty">正在加载…</p>
        <p v-if="admin.error" class="error">{{ admin.error }}</p>
        <ul class="adm-list">
          <li v-for="u in adminUsers" :key="u.name"><button type="button" class="adm-row" @click="openUser(u.name)">
            <i class="adm-ava">{{ u.name.slice(0, 1) }}</i>
            <span class="adm-main">
              <span class="adm-name"><b>{{ u.name }}</b><b v-if="u.admin" class="paid-mark admin-mark">查看器账号</b><b v-if="u.newUser"
                class="paid-mark">只用独立环境</b><b v-if="planning(u)" class="paid-mark mine-mark">计划中</b></span>
              <small>收到 {{ fmtPts(u.granted) }} · 支出 {{ fmtPts(u.spent) }}<template v-if="u.ts"> · {{ ago(u.ts) }}注册</template></small>
              <small v-if="admin.recentOf" class="recent-pts">最近 {{ admin.recentOf }} 分钟
                <spent-pts v-if="spentText(u.recent?.all) || u.recent?.bought" :spent="u.recent.all" :paid="u.recent.paid" :blue="u.recent.blue"
                           :bought="u.recent.bought ?? 0"></spent-pts><template v-else>无用量</template></small></span>
            <span class="adm-bal"><b :class="{ neg: u.balance < 0 }">{{ fmtPts(u.balance) }}</b><small>余额</small></span>
            <i class="side-chev"></i></button></li>
          <li v-if="!admin.loading && !admin.users.length" class="adm-empty">暂无注册用户</li>
          <!-- 无主会话不是一个人，点不进去，也不参与排序 -->
          <li v-if="admin.orphan && admin.recentOf" class="adm-orphan">无主会话
            <small class="recent-pts">最近 {{ admin.recentOf }} 分钟
              <spent-pts v-if="spentText(admin.orphan.all)" :spent="admin.orphan.all" :paid="admin.orphan.paid" :blue="admin.orphan.blue"></spent-pts><template v-else>无用量</template></small>
          </li>
        </ul>
      </template>
      <template v-else>
        <header class="info-head adm-head">
          <button type="button" class="adm-back" aria-label="返回用户列表" @click="openUser('')"><i class="side-chev"></i></button>
          <i class="adm-ava">{{ adminUser.name.slice(0, 1) }}</i>
          <strong>{{ adminUser.name }}</strong>
          <small><b v-if="adminUser.admin" class="paid-mark admin-mark">查看器账号</b><template v-if="adminUser.ts">{{ ago(adminUser.ts) }}注册</template></small>
          <span class="head-btns"><button @click="openAdmin()">刷新</button><button @click="admin.open = false">关闭</button></span>
        </header>
        <div class="adm-body">
          <div class="adm-sum">
            <div class="adm-big"><small>余额</small><b :class="{ neg: adminUser.balance < 0 }">{{ fmtPts(adminUser.balance) }}</b></div>
            <div class="adm-stats">
              <span>收到 {{ fmtPts(adminUser.granted) }} · 支出 {{ fmtPts(adminUser.spent) }}<template v-if="adminUser.unrated"> · {{ adminUser.unrated }} 次暂无单价</template></span>
              <span v-if="admin.recentOf" class="recent-pts">最近 {{ admin.recentOf }} 分钟
                <spent-pts v-if="spentText(adminUser.recent?.all) || adminUser.recent?.bought" :spent="adminUser.recent.all" :paid="adminUser.recent.paid"
                           :blue="adminUser.recent.blue" :bought="adminUser.recent.bought ?? 0"></spent-pts><template v-else>无用量</template></span>
            </div>
            <button type="button" @click="openLedger(adminUser.name)">账本</button>
          </div>
          <section class="adm-sec">
            <div class="adm-sec-head"><b>发放额度</b>
              <div class="dev-seg"><button type="button" :class="{ on: admin.grant.mode === 'plan' }" @click="admin.grant.mode = 'plan'">按月计划</button><button
                type="button" :class="{ on: admin.grant.mode === 'once' }" @click="admin.grant.mode = 'once'">一次发放</button></div></div>
            <form class="adm-form" @submit.prevent="grantPoints">
              <label class="adm-amt"><input v-model="admin.grant.amount" inputmode="decimal"
                :placeholder="admin.grant.mode === 'plan' ? '本月总额' : '金额'"><span>元</span></label>
              <!-- 开始日期：可以是以前的某一天（比如从他的号上来的那天算起），到期了的几期建好就到账 -->
              <label v-if="admin.grant.mode === 'plan'" class="adm-start">开始<input v-model="admin.grant.start" type="date"></label>
              <input v-model="admin.grant.note" placeholder="备注（选填，对方账本里可见）">
              <button class="adm-go" :disabled="!!admin.busy">{{ admin.busy === 'grant' ? '正在发放…' : '发放' }}</button>
            </form>
            <p class="adm-hint">{{ grantHint }}</p>
          </section>
          <!-- 旧后端的名单上不带 plans，就没有这一栏 -->
          <section v-if="adminUser.plans" class="adm-sec">
            <div class="adm-sec-head"><b>额度计划</b></div>
            <div v-for="p in adminUser.plans" :key="p.id" class="adm-plan">
              <grant-plan :plan="p"></grant-plan>
              <div class="adm-plan-foot"><small>{{ p.by }} 于 {{ ago(p.start) }}建立<template v-if="p.revoked">，{{ p.revoked.by }} 于 {{ ago(p.revoked.ts) }}撤销</template></small>
                <button v-if="!p.revoked && admin.revoking !== p.id" type="button" class="mini danger"
                        @click="admin.revoking = p.id">撤销</button></div>
              <!-- 撤销就当这个计划没发生过：已发的几期一起收回 -->
              <div v-if="admin.revoking === p.id" class="dev-confirm">
                <p>撤销后当作这个计划没有发生过：<template v-if="p.given">已发放的 {{ fmtPts(p.given) }} 一并收回，</template>余下的不再发放。</p>
                <div class="dev-form-btns"><button type="button" class="danger" :disabled="!!admin.busy" @click="revokePlan(p)">{{ admin.busy === 'revoke'
                  ? '正在撤销…' : '确认撤销' }}</button><button type="button" @click="admin.revoking = ''">取消</button></div>
              </div>
            </div>
            <p v-if="!adminUser.plans.length" class="adm-empty">暂无额度计划</p>
          </section>
          <section v-if="me.multi" class="adm-sec">
            <div class="adm-sec-head"><b>账号</b></div>
            <form class="adm-form" @submit.prevent="resetPassword">
              <input v-model="admin.reset.password" type="text" autocomplete="off" placeholder="新密码（至少 4 位），请告知对方">
              <button :disabled="!!admin.busy">{{ admin.busy === 'reset' ? '正在修改…' : '重设密码' }}</button>
            </form>
            <!-- 只用独立环境的人（users.is_new，字段名沿用 newUser：没用过共用环境、查看器账号也没给他打开）：旧后端不给 newUser，不显示这一行 -->
            <div v-if="'newUser' in adminUser" class="adm-line"><span>运行环境：{{ adminUser.newUser ? '只用独立环境' : '可选择共用环境' }}</span>
              <button type="button" class="mini" :disabled="!!admin.busy" @click="setNewUser(adminUser, !adminUser.newUser)">{{ admin.busy === 'new:' + adminUser.name
                ? '正在修改…' : adminUser.newUser ? '允许共用环境' : '改为只用独立环境' }}</button></div>
          </section>
          <p v-if="admin.error" class="error">{{ admin.error }}</p>
        </div>
      </template>
    </section>
  </div>

  <!-- 流量（查看器账号）：网络闸门记下的每条连接加起来（server.admin_traffic）。按会话是会话自己发出去的，按号是真正出网的；
       某个小时传得特别多的会话标红 -->
  <div v-if="traffic.open" class="mask" @click.self="traffic.open = false">
    <section class="picker admin">
      <header class="info-head">
        <strong>流量</strong>
        <small>经网络闸门的连接，上行 / 下行</small>
        <span class="head-btns"><button @click="openTraffic()">刷新</button><button @click="traffic.open = false">关闭</button></span>
      </header>
      <div class="ov-ctrl admin-ctrl">
        <label>最近<input v-model.number="traffic.hours" type="number" min="1" max="720" @change="openTraffic()">小时</label>
      </div>
      <p v-if="traffic.loading" class="empty">正在加载…</p>
      <template v-if="traffic.data">
        <div class="dd-group">按账号（实际出网流量）</div>
        <ul class="entries">
          <li v-for="a in traffic.data.accounts" :key="a.account" class="plain">
            <span class="label"><span>{{ a.account }}</span><small>{{ a.n }} 条连接</small></span>
            <small>上行 <b>{{ mbText(a.up) }}</b> · 下行 {{ mbText(a.down) }}</small>
          </li>
          <li v-if="!traffic.data.accounts.length" class="plain">这段时间没有出网的连接</li>
        </ul>
        <div class="dd-group">按会话</div>
        <ul class="entries">
          <li v-for="s in traffic.data.sessions" :key="s.sid" :class="{ 'traffic-alert': s.alert }"
              @click="s.path && (openFromLedger(s), traffic.open = false)">
            <span class="label"><span>{{ s.title || s.sid }}</span>
              <small>{{ s.owner || '无主' }} · {{ s.account }} · {{ s.n }} 条连接
                <template v-if="s.alert"> · 有一个小时传了 {{ mbText(s.peakHour) }}，超过 {{ mbText(traffic.data.alertPerHour) }}</template></small></span>
            <small>上行 <b>{{ mbText(s.up) }}</b> · 下行 {{ mbText(s.down) }}</small>
          </li>
          <li v-if="!traffic.data.sessions.length" class="plain">这段时间没有会话的连接</li>
        </ul>
      </template>
      <p v-if="traffic.error" class="error">{{ traffic.error }}</p>
    </section>
  </div>
  </template>
</div>
<script type="module" src="js/app.js?v=4"></script>
</body>
</html>
